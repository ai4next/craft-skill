<details class="craft-card">
  <summary>这份示例想说明什么</summary>
  <p>
    整张图里<strong>没有一个坐标</strong>。模型只描述了「有哪些组件、谁连谁、谁属于哪个分组」，
    分层、排序、坐标、正交路由、端口分配、标签避让全部由运行时算出。
  </p>
  <p>
    对比之下，同类工具要求作者为每个组件手写 <code>x/y</code> 和 <code>宽/高</code>，
    再用一堆校验器去检查这些手写的坐标有没有重叠、有没有压住别的元素。
  </p>
</details>
