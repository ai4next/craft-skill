<script type="application/json" data-craft-data="main">
{
  "kind": "dataflow",
  "title": "埋点数据管道",
  "stages": [
    { "id": "src", "label": "数据源" },
    { "id": "ingest", "label": "接入" },
    { "id": "wh", "label": "数仓" },
    { "id": "consume", "label": "消费" }
  ],
  "nodes": [
    { "id": "app", "label": "客户端埋点", "stage": "src", "kind": "source" },
    { "id": "collector", "label": "采集服务", "stage": "ingest", "kind": "transform" },
    { "id": "dwd", "label": "明细层", "stage": "wh", "kind": "store" },
    { "id": "bi", "label": "报表看板", "stage": "consume", "kind": "consumer" }
  ],
  "edges": [
    { "from": "app", "to": "collector", "label": "上报" },
    { "from": "collector", "to": "dwd", "label": "写入" },
