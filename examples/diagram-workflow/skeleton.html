<!--
  workflow 子类型的最小骨架 —— 「往 assets/template.html 的四个哨兵槽里写什么」的示范。

  不要单独打开这个文件。用法：复制 assets/template.html，把下面四段分别替换掉
  对应的哨兵注释。

  泳道流程的模型形状：lanes + steps（步骤用 lane 归属泳道）+ edges。
  **没有 nodes**。列号、泳道带高、决策菱形全由运行时算。
-->


<!-- ═══════════ 替换 HEAD_SLOT ═══════════ -->

<title>发布审批流程</title>
<meta name="description" content="一个最小泳道流程示例：开发、CI 与运维的跨泳道流程">

<style>
  .diagram-wrap { margin-top: var(--craft-sp-5); }
</style>


<!-- ═══════════ 替换 BODY_SLOT ═══════════ -->

<h1>发布审批流程</h1>

<p class="craft-lede">
  从提交代码到上线的跨泳道流程。点击任意步骤可查看它的上下游。
</p>

<div class="diagram-wrap">
  <div data-craft-diagram="workflow"
       data-craft-model="main"
       data-craft-diagram-label="发布审批流程图"></div>

  <p class="craft-caption">
    <strong>示意内容</strong> —— 用于演示，不代表任何真实系统。
  </p>
</div>


<!-- ═══════════ 替换 DATA_SLOT ═══════════ -->

<script type="application/json" data-craft-data="main">
{
  "kind": "workflow",
  "title": "发布审批流程",
  "lanes": [
    { "id": "dev", "label": "开发" },
    { "id": "ci", "label": "CI" },
    { "id": "ops", "label": "运维" }
  ],
  "steps": [
    { "id": "push", "label": "提交代码", "lane": "dev", "kind": "start" },
    { "id": "build", "label": "构建镜像", "lane": "ci", "kind": "task" },
    { "id": "test", "label": "测试通过？", "lane": "ci", "kind": "decision" },
    { "id": "approve", "label": "人工审批", "lane": "ops", "kind": "task" },
    { "id": "deploy", "label": "滚动发布", "lane": "ops", "kind": "end" }
  ],
  "edges": [
    { "from": "push", "to": "build" },
    { "from": "build", "to": "test" },
    { "from": "test", "to": "approve", "label": "是" },
    { "from": "test", "to": "push", "label": "否", "kind": "retry" },
    { "from": "approve", "to": "deploy" }
  ]
}
</script>
