<script data-craft-owned>
/* 预绘制主题解析：必须在样式生效前跑完，否则会闪一下深色。
   优先级：?theme= 参数 → localStorage → 系统偏好。 */
(function () {
  var root = document.documentElement;
  var theme = null;
  try {
    var param = new URLSearchParams(location.search).get('theme');
    if (param === 'light' || param === 'dark') theme = param;
    if (!theme) {
      var stored = localStorage.getItem('craft-theme');
      if (stored === 'light' || stored === 'dark') theme = stored;
    }
    if (!theme && window.matchMedia) {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
  } catch (_) { /* 隐私模式下 localStorage 会抛错，忽略 */ }
  root.setAttribute('data-theme', theme || 'dark');
})();
</script>

  position: absolute;
  left: var(--craft-sp-3);
  bottom: var(--craft-sp-3);
  width: 236px;
  padding: var(--craft-sp-3) var(--craft-sp-4);
  background: var(--craft-surface);
  border: 1px solid var(--craft-border);
  border-radius: var(--craft-r-lg);
  box-shadow: var(--craft-shadow-md);

}

  color: var(--craft-muted);

}
.craft-panel-title { margin: var(--craft-sp-1) 0 var(--craft-sp-1); font-size: var(--craft-fs-lg); }

}
.craft-panel-actions { display: flex; flex-wrap: wrap; gap: var(--craft-sp-2); margin-top: var(--craft-sp-3); }

  position: absolute;
  top: var(--craft-sp-3);
  right: calc(var(--craft-sp-3) + 220px);

/* ── fmt ──────────────────────────────────────────────── */

var locale = null;

function currentLocale() {
  if (locale) return locale;
  var root = document.body || document.documentElement;
  locale = root.getAttribute('data-craft-locale') ||
           document.documentElement.getAttribute('lang') || 'zh-CN';
  return locale;
}

function isCJK() { return /^zh|^ja|^ko/i.test(currentLocale()); }

function trimZero(s) { return s.replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1'); }

  locale: currentLocale,
  number: function (v, opts) {
    opts = opts || {};
    var n = util.num(v);
    if (!isFinite(n)) return '—';
    var d = opts.digits;
    if (d == null) d = Math.abs(n) < 10 && n % 1 !== 0 ? 1 : 0;
    try {
      return n.toLocaleString(currentLocale(), {
        minimumFractionDigits: d, maximumFractionDigits: d

  },
  /* 中文用万/亿，其余用 K/M/B */
  compact: function (v) {
    var n = util.num(v);
    if (!isFinite(n)) return '—';

    var a = Math.abs(n);

      ? [[1e8, '亿'], [1e4, '万']]
      : [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
    for (var i = 0; i < units.length; i++) {
      if (a >= units[i][0]) return sign + trimZero((a / units[i][0]).toFixed(1)) + units[i][1];
    }
    return sign + trimZero(a.toFixed(a < 10 && a % 1 !== 0 ? 1 : 0));
  },
  si: function (v) {
    var n = util.num(v);
    if (!isFinite(n)) return '—';
    var a = Math.abs(n), s = n < 0 ? '-' : '';
    if (a >= 1e9) return s + trimZero((a / 1e9).toFixed(1)) + 'G';
    if (a >= 1e6) return s + trimZero((a / 1e6).toFixed(1)) + 'M';
    if (a >= 1e3) return s + trimZero((a / 1e3).toFixed(1)) + 'k';
    return s + trimZero(a.toFixed(a % 1 ? 1 : 0));
  },
  percent: function (v, digits) {
    var n = util.num(v);
    if (!isFinite(n)) return '—';
    return (n * 100).toFixed(digits == null ? 0 : digits) + '%';
  },
  /* 支持 %Y %m %d %H %M %S %b（月份缩写） */
  date: function (v, pattern) {
    var d = v instanceof Date ? v : new Date(v);
    if (isNaN(d.getTime())) return '—';
    var p = pattern || '%Y-%m-%d';
    var pad = function (x) { return (x < 10 ? '0' : '') + x; };
    var MON = isCJK()
      ? ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']

      .replace(/%Y/g, d.getFullYear())
      .replace(/%m/g, pad(d.getMonth() + 1))
      .replace(/%d/g, pad(d.getDate()))
      .replace(/%H/g, pad(d.getHours()))

      .replace(/%S/g, pad(d.getSeconds()))

    if (type === 'time') {
      var p = pattern || '%m-%d';
      return function (v) { return fmt.date(v, p); };
    }
    /* band 的刻度是类别标签，不是数值。套数字格式化会把「涨 20%」里的 20

    if (type === 'band') return function (v) { return v == null ? '' : String(v); };
    return function (v) {
      var n = util.num(v);
      if (!isFinite(n)) return String(v);

    '--craft-text', '--craft-muted', '--craft-faint', '--craft-accent',
    '--craft-grid', '--craft-axis',
    '--craft-shadow-sm', '--craft-shadow-md',
    '--craft-font-sans', '--craft-font-mono'

  [['cat', 8], ['seq', 5], ['div', 5]].forEach(function (fam) {
    for (var i = 0; i < fam[1]; i++) names.push('--craft-' + fam[0] + '-' + i);

  current: function () {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';

    try { localStorage.setItem('craft-theme', next); } catch (_) {}
    themeSubs.forEach(function (fn) { try { fn(next); } catch (e) { console.error(e); } });

/* ── color ────────────────────────────────────────────── */

      return [parseInt(s[1] + s[1], 16), parseInt(s[2] + s[2], 16), parseInt(s[3] + s[3], 16)];
    }
    return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];

  var c1 = parseColor(theme.token('--craft-' + prefix + '-' + (i + 1), '#888'));

var color = Craft.color = {
  /* 分类色：按序号循环，保证同序号同色 */

  /* 非颜色线索：给第 i 个系列一个图案编号（1..3），供图例画不同边框 */

/* ── scale ────────────────────────────────────────────── */

function tickStep(start, stop, count) {

  [1000, 'second', [1, 2, 5, 10, 15, 30]],
  [60000, 'minute', [1, 2, 5, 10, 15, 30]],
  [3600000, 'hour', [1, 2, 3, 6, 12]],
  [86400000, 'day', [1, 2, 7, 14]],
  [2592000000, 'month', [1, 2, 3, 6]],
  [31536000000, 'year', [1, 2, 5, 10, 25, 50, 100]]

  var out = [];

    advance = function (x) { return new Date(x.getFullYear(), x.getMonth() + mult, 1); };
  } else {
    cur = new Date(d0.getFullYear(), 0, 1);
    advance = function (x) { return new Date(x.getFullYear() + mult, 0, 1); };
  }
  var TOL = 86400000;

        axisG.appendChild(util.svgEl('text', {
          x: orient === 'left' ? -8 : 8,

      }
    });

    if (opts.label) {
      if (vertical) {
        /* rotate(-90) 后，旋转坐标系里 (rx,ry) 对应原坐标 (ry, -rx)。
           想让标签落在绘图区左侧 x=-46、纵向居中 y=(lo+hi)/2，
           就得取 rx = -(lo+hi)/2, ry = -46。 */
        axisG.appendChild(util.svgEl('text', {
          'class': 'craft-axis-label',
          transform: 'rotate(-90)',
          x: -(lo + hi) / 2,
          y: orient === 'left' ? -46 : 46,
          'text-anchor': 'middle',
          'dominant-baseline': 'hanging',
          text: opts.label
        }));
      } else {
        axisG.appendChild(util.svgEl('text', {
          'class': 'craft-axis-label',
          x: (lo + hi) / 2,
          y: orient === 'bottom' ? 36 : -32,
          'text-anchor': 'middle',
          text: opts.label
        }));
      }
    }
    return axisG;
  }
};

/* ── data ─────────────────────────────────────────────── */

var dataCache = null;

function rowsOf(d) {
  if (Array.isArray(d)) return d;
  if (d && Array.isArray(d.rows)) return d.rows;
  if (d && typeof d === 'object') {
    for (var k in d) {
      if (Object.prototype.hasOwnProperty.call(d, k) && Array.isArray(d[k])) return d[k];
    }
  }
  return [];
}

Craft.data = {
  all: function () {
    if (dataCache) return dataCache;
    dataCache = {};
    util.qsa('script[data-craft-data]').forEach(function (s) {
      var key = s.getAttribute('data-craft-data') || 'main';
      try {
        dataCache[key] = JSON.parse(s.textContent);
      } catch (e) {
        console.error('[craft] 数据块 "' + key + '" 解析失败：' + e.message);
        dataCache[key] = null;
      }
    });
    return dataCache;
  },
  get: function (key) { return Craft.data.all()[key || 'main']; },
  rows: function (key) { return rowsOf(Craft.data.get(key)); },
  /* 供程序化注入（例如模拟里生成的序列） */
  set: function (key, value) {
    Craft.data.all()[key] = value;
  },
  rowsOf: rowsOf
};

/* ── model ────────────────────────────────────────────── */

/* 图解模型：只有拓扑，没有坐标。
   归一化 + 索引，同样 DOM-free —— check.mjs 要在 Node 里直接调 layout.run(model)。 */

var DIAGRAM_KINDS = ['architecture', 'workflow', 'sequence', 'dataflow', 'lifecycle', 'freeform'];

var NODE_KIND_SETS = {
  architecture: ['frontend', 'backend', 'database', 'cloud', 'security', 'messagebus', 'external'],
  workflow: ['start', 'end', 'task', 'decision', 'io'],
  lifecycle: ['normal', 'failure', 'terminal'],
  dataflow: ['source', 'transform', 'store', 'consumer'],
  sequence: ['participant'],
  freeform: ['default']
};

var DEFAULT_NODE_KIND = {
  architecture: 'backend', workflow: 'task', lifecycle: 'normal',
  dataflow: 'transform', sequence: 'participant', freeform: 'default'
};

function normDirection(d) {
  return (d === 'LR' || d === 'RL' || d === 'BT') ? d : 'TB';
}

function normNode(raw, i, kind) {
  raw = raw || {};
  var id = raw.id != null ? String(raw.id) : 'n' + i;
  var k = raw.kind || raw.type;
  var allowed = NODE_KIND_SETS[kind] || NODE_KIND_SETS.freeform;
  return {
    id: id,
    label: raw.label != null ? String(raw.label) : id,
    sublabel: raw.sublabel != null ? String(raw.sublabel) : null,
    kind: allowed.indexOf(k) >= 0 ? k : DEFAULT_NODE_KIND[kind],
    group: raw.group != null ? String(raw.group) : null,
    lane: raw.lane != null ? String(raw.lane) : null,
    stage: raw.stage != null ? String(raw.stage) : null,
    phase: raw.phase != null ? String(raw.phase) : null,
    row: raw.row, col: raw.col,
    rank: raw.rank, order: raw.order,
    pos: raw.pos, size: raw.size,
    index: i
  };
}

function normEdge(raw, i) {
  raw = raw || {};
  return {
    id: raw.id != null ? String(raw.id) : 'e' + i,
    from: raw.from != null ? String(raw.from) : null,
    to: raw.to != null ? String(raw.to) : null,
    label: raw.label != null ? String(raw.label) : null,
    variant: raw.variant === 'dashed' || raw.variant === 'emphasis' ? raw.variant : 'default',
    fromSide: raw.fromSide || 'auto',
    toSide: raw.toSide || 'auto',
    kind: raw.kind || null,
    index: i,
    reversed: false
  };
}

function normKeyed(list, fallbackPrefix) {
  return (Array.isArray(list) ? list : []).map(function (x, i) {
    x = x || {};
    return {
      id: x.id != null ? String(x.id) : fallbackPrefix + i,
      label: x.label != null ? String(x.label) : (x.id != null ? String(x.id) : fallbackPrefix + i),
      index: i,
      _raw: x
    };
  });
}

var model = Craft.model = {
  KINDS: DIAGRAM_KINDS,
  nodeKinds: function (kind) { return NODE_KIND_SETS[kind] || NODE_KIND_SETS.freeform; },

  /** 把作者写的 JSON 归一化成统一模型。所有布局策略都只认这个结构。 */
  fromJSON: function (raw, fallbackKind) {
    raw = raw || {};
    var kind = DIAGRAM_KINDS.indexOf(raw.kind) >= 0
      ? raw.kind
      : (DIAGRAM_KINDS.indexOf(fallbackKind) >= 0 ? fallbackKind : 'architecture');

    var m = {
      kind: kind,
      direction: normDirection(raw.direction),
      title: raw.title || null,
      subtitle: raw.subtitle || null,
      viewBox: Array.isArray(raw.viewBox) ? raw.viewBox.slice(0, 4) : null,
      nodes: [], edges: [], groups: [],
      lanes: [], participants: [], stages: [], phases: [], outcomes: [], blocks: [],
      views: [], byId: {}, warnings: []
    };

    /* 各类型的节点来源不同，统一收进 nodes */
    var nodeSource = raw.nodes || raw.steps || raw.events || raw.participants || [];
    m.nodes = nodeSource.map(function (n, i) { return normNode(n, i, kind); });

    /* lifecycle 的终态单独一段，但仍参与布局 */
    (Array.isArray(raw.outcomes) ? raw.outcomes : []).forEach(function (o) {
      var n = normNode(o, m.nodes.length, kind);
      n.kind = 'terminal';
      m.nodes.push(n);
    });

    var edgeSource = raw.edges || raw.transitions || raw.flows || raw.messages || [];
    m.edges = edgeSource.map(normEdge);

    m.groups = normKeyed(raw.groups, 'g');
    m.lanes = normKeyed(raw.lanes, 'lane');
    m.stages = normKeyed(raw.stages, 'stage');
    m.phases = normKeyed(raw.phases, 'phase');
    m.outcomes = normKeyed(raw.outcomes, 'out');
    m.blocks = Array.isArray(raw.blocks) ? raw.blocks.slice() : [];

    /* sequence 的 participants 顺序就是列顺序，必须保住 */
    if (kind === 'sequence') {
      m.participants = m.nodes.slice();
    }

    m.views = (Array.isArray(raw.views) ? raw.views : []).slice(0, 5).map(function (v, i) {
      return {
        id: v.id != null ? String(v.id) : 'v' + i,
        label: v.label != null ? String(v.label) : '视图 ' + (i + 1),
        focus: Array.isArray(v.focus) ? v.focus.map(String) : [],
        note: v.note || null
      };
    });

    m.nodes.forEach(function (n) {
      if (m.byId[n.id]) m.warnings.push('重复的节点 id：' + n.id);
      m.byId[n.id] = n;
    });
    m.edges.forEach(function (e) {
      if (!m.byId[e.from]) m.warnings.push('边 ' + e.id + ' 的 from 指向不存在的节点：' + e.from);
      if (!m.byId[e.to]) m.warnings.push('边 ' + e.id + ' 的 to 指向不存在的节点：' + e.to);
    });

    return m;
  },

  /** 从容器读模型：优先 data-craft-model 指定的 JSON 块，退化到属性写法 */
  fromDOM: function (el) {
    var subtype = el.getAttribute('data-craft-diagram');
    var key = el.getAttribute('data-craft-model');
    if (key) {
      var d = Craft.data.get(key);
      if (d) return model.fromJSON(d, subtype);
      console.warn('[craft] 图解 ' + (subtype || '') + ' 找不到模型块 "' + key + '"');
    }

    var nodes = util.qsa('[data-craft-node]', el).map(function (n, i) {
      return {
        id: n.getAttribute('data-craft-node') || 'n' + i,
        label: n.getAttribute('data-craft-node-label'),
        sublabel: n.getAttribute('data-craft-node-sublabel'),
        kind: n.getAttribute('data-craft-node-kind'),
        group: n.getAttribute('data-craft-node-group'),
        lane: n.getAttribute('data-craft-node-lane'),
        stage: n.getAttribute('data-craft-node-stage'),
        phase: n.getAttribute('data-craft-node-phase'),
        pos: parsePos(n.getAttribute('data-craft-node-pos'))
      };
    });
    var edges = util.qsa('[data-craft-edge]', el).map(function (e, i) {
      var pair = String(e.getAttribute('data-craft-edge') || '').split('->');
      return {
        id: e.getAttribute('data-craft-edge-id') || 'e' + i,
        from: (pair[0] || '').trim(),
        to: (pair[1] || '').trim(),
        label: e.getAttribute('data-craft-edge-label'),
        variant: e.getAttribute('data-craft-edge-variant'),
        kind: e.getAttribute('data-craft-edge-kind')
      };
    });
    var groups = util.qsa('[data-craft-group]', el).map(function (g, i) {
      return {
        id: g.getAttribute('data-craft-group') || 'g' + i,
        label: g.getAttribute('data-craft-group-label')
      };
    });

    return model.fromJSON({ kind: subtype || 'freeform', nodes: nodes, edges: edges, groups: groups }, subtype);
  },

  /** 模型里出现的所有节点 id */
  ids: function (m) {
    return m.nodes.map(function (n) { return n.id; });
  }
};

function parsePos(s) {
  if (!s) return null;
  var parts = String(s).split(/[,\s]+/).map(parseFloat);
  return parts.length >= 2 && parts.slice(0, 2).every(isFinite) ? [parts[0], parts[1]] : null;
}

/* ── tooltip ──────────────────────────────────────────── */

var tipEl = null;

function ensureTip() {
  if (tipEl) return tipEl;
  tipEl = util.el('div', { 'class': 'craft-tooltip', role: 'presentation', 'aria-hidden': 'true' });
  document.body.appendChild(tipEl);
  return tipEl;
}

var tooltip = Craft.tooltip = {
  show: function (html, x, y) {
    var t = ensureTip();
    t.innerHTML = html;
    t.setAttribute('data-visible', 'true');
    tooltip.move(x, y);
  },
  move: function (x, y) {
    if (!tipEl) return;
    var pad = 14;
    var r = tipEl.getBoundingClientRect();
    var left = x + pad, top = y + pad;
    if (left + r.width > window.innerWidth - 8) left = x - r.width - pad;
    if (top + r.height > window.innerHeight - 8) top = y - r.height - pad;
    tipEl.style.left = Math.max(8, left) + 'px';
    tipEl.style.top = Math.max(8, top) + 'px';
  },
  hide: function () { if (tipEl) tipEl.setAttribute('data-visible', 'false'); },
  /* 把一组 [data-craft-mark] 元素接上悬停 + 键盘焦点 */
  attach: function (root, renderFn) {
    util.qsa('[data-craft-mark]', root).forEach(function (n) {
      if (n.__craftWired) return;
      n.__craftWired = true;
      if (!n.hasAttribute('tabindex')) n.setAttribute('tabindex', '0');
      if (!n.hasAttribute('role')) n.setAttribute('role', 'graphics-symbol');
      var d = n.__data__;
      var label = n.getAttribute('aria-label') || n.getAttribute('data-label') || '';
      if (label && !n.hasAttribute('aria-label')) n.setAttribute('aria-label', label);

      function enter(ev) {
        var html = renderFn ? renderFn(d, n) : util.esc(label);
        var r = n.getBoundingClientRect();
        var pt = ev && ev.clientX != null
          ? { x: ev.clientX, y: ev.clientY }
          : { x: r.left + r.width / 2, y: r.top };
        tooltip.show(html, pt.x, pt.y);
      }
      util.on(n, 'mouseenter', enter);
      util.on(n, 'mousemove', function (ev) { tooltip.move(ev.clientX, ev.clientY); });
      util.on(n, 'mouseleave', tooltip.hide);
      util.on(n, 'focus', enter);
      util.on(n, 'blur', tooltip.hide);
    });
  }
};

/* ── selection / join ─────────────────────────────────── */

function makeSel(nodes) {
  var sel = {
    nodes: nodes,
    attr: function (k, v) {
      nodes.forEach(function (n, i) {
        var val = typeof v === 'function' ? v(n.__data__, i) : v;
        if (val == null || val === false) n.removeAttribute(k);
        else n.setAttribute(k, val);
      });
      return sel;
    },
    style: function (k, v) {
      nodes.forEach(function (n, i) {
        var val = typeof v === 'function' ? v(n.__data__, i) : v;
        n.style.setProperty(k, val);
      });
      return sel;
    },
    text: function (v) {
      nodes.forEach(function (n, i) {
        n.textContent = typeof v === 'function' ? v(n.__data__, i) : v;
      });
      return sel;
    },
    each: function (fn) {
      nodes.forEach(function (n, i) { fn.call(n, n.__data__, i); });
      return sel;
    },
    on: function (ev, fn) {
      nodes.forEach(function (n) { n.addEventListener(ev, fn); });
      return sel;
    },
    remove: function () {
      nodes.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); });
      return sel;
    },
    filter: function (fn) {
      return makeSel(nodes.filter(function (n, i) { return fn(n.__data__, i); }));
    },
    call: function (fn) { fn(sel); return sel; }
  };
  return sel;
}

/* 按键 join：重绘时节点数恒定，不会叠加。
   enter.append() 负责创建缺失节点，update 覆盖全部节点，exit 删除多余节点。 */
function makeJoin(root, selector, rows, keyFn) {
  var existing = util.qsa(selector, root);
  var byKey = {};
  existing.forEach(function (n) {
    var k = n.getAttribute('data-key');
    if (k != null) (byKey[k] = byKey[k] || []).push(n);
  });
  var entered = [];
  var keyOf = function (d, i) { return String(keyFn ? keyFn(d, i) : i); };

  var selection = {
    enter: {
      append: function (tag, attrs) {
        rows.forEach(function (d, i) {
          var k = keyOf(d, i);
          var pool = byKey[k];
          if (pool && pool.length) { pool.shift(); return; }
          var node = util.svgEl(tag, attrs || {});
          node.setAttribute('data-key', k);
          node.__data__ = d;
          node.__index__ = i;
          root.appendChild(node);
          entered.push(node);
        });
        return selection;
      }
    },
    get update() {
      var nodes = [];
      rows.forEach(function (d, i) {
        var k = keyOf(d, i);
        var found = util.qsa('[data-key="' + cssEscape(k) + '"]', root).filter(function (n) {
          return n.parentNode === root;
        })[0];
        if (found) { found.__data__ = d; found.__index__ = i; nodes.push(found); }
      });
      return makeSel(nodes);
    },
    get exit() {
      var keep = {};
      rows.forEach(function (d, i) { keep[keyOf(d, i)] = true; });
      var dead = util.qsa(selector, root).filter(function (n) {
        return !keep[n.getAttribute('data-key')];
      });
      return makeSel(dead);
    }
  };
  return selection;
}

function cssEscape(s) {
  return String(s).replace(/["\\]/g, '\\$&');
}

/* ── chart ────────────────────────────────────────────── */

var charts = [];
var uid = 0;

function inferType(rows, field) {
  var v = null;
  for (var i = 0; i < rows.length && v == null; i++) {
    if (rows[i] && rows[i][field] != null) v = rows[i][field];
  }
  if (v == null) return 'linear';
  if (typeof v === 'number') return 'linear';
  if (v instanceof Date) return 'time';
  var s = String(v);
  if (/^\d{4}-\d{2}(-\d{2})?/.test(s)) return 'time';
  return 'band';
}

function extent(rows, field) {
  var lo = Infinity, hi = -Infinity;
  rows.forEach(function (d) {
    var v = d ? d[field] : null;
    if (v == null) return;
    var n = typeof v === 'number' ? v : Date.parse(v);
    if (isNaN(n)) n = util.num(v);
    if (isNaN(n)) return;
    if (n < lo) lo = n;
    if (n > hi) hi = n;
  });
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  return [lo, hi];
}

function seriesOf(rows, cfg) {
  if (!cfg.series || !cfg.series.field) return [null];
  var seen = {}, out = [];
  rows.forEach(function (d) {
    var v = d ? d[cfg.series.field] : null;
    if (v == null) return;
    var k = String(v);
    if (!seen[k]) { seen[k] = true; out.push(k); }
  });
  return out.length ? out : [null];
}

function defaultTip(d, cfg, chart) {
  if (!d) return '';
  var xv = d[cfg.x.field];
  var title = cfg.x.type === 'time' ? fmt.date(xv, cfg.x.format) : String(xv);
  var html = '<div class="craft-tooltip-title">' + util.esc(title) + '</div><dl>';
  if (cfg.series && cfg.series.field) {
    html += '<dt>' + util.esc(String(d[cfg.series.field])) + '</dt><dd>' +
      util.esc(fmt.number(d[cfg.y.field], { digits: 1 })) + '</dd>';
  } else {
    html += '<dt>' + util.esc(cfg.y.label || cfg.y.field) + '</dt><dd>' +
      util.esc(fmt.number(d[cfg.y.field], { digits: 1 })) + '</dd>';
  }
  return html + '</dl>';
}

/* ── layout ───────────────────────────────────────────── */

/* 布局引擎：模型（只有拓扑）→ 场景（含全部几何）。
   全程 DOM-free，check.mjs 会在 Node 里直接调 run() 做几何断言。
   所有排序的平局都按 id 兜底 —— 两次运行必须得到逐字节相同的结果。 */

var SPACING = {
  rank: 62,        // 层间距
  node: 30,        // 同层节点间距
  groupPad: 18,    // 分组框内边距
  groupTitle: 26,  // 分组框标题占用的高度
  margin: 24
};

var layout = Craft.layout = {};

/* ── 图算法基元 ───────────────────────────────────────── */

/** 邻接表。只保留两端都存在的边；自环单独摘出来 */
function buildAdjacency(m) {
  var succ = {}, pred = {}, selfLoops = [];
  m.nodes.forEach(function (n) { succ[n.id] = []; pred[n.id] = []; });
  var edges = [];
  m.edges.forEach(function (e) {
    if (!m.byId[e.from] || !m.byId[e.to]) return;      // 悬空边由 check.mjs 报
    if (e.from === e.to) { selfLoops.push(e); return; }
    edges.push(e);
    succ[e.from].push(e.to);
    pred[e.to].push(e.from);
  });
  return { succ: succ, pred: pred, edges: edges, selfLoops: selfLoops };
}

/** DFS 断环：回边标记 reversed，分层时反向用，路由时按原向画（虚线） */
function breakCycles(m, adj) {
  var color = {}, backSet = {};
  var edgeOf = {};
  adj.edges.forEach(function (e) { edgeOf[e.from + ' ' + e.to] = e; });

  function visit(start) {
    /* 显式栈，避免深图爆栈 */
    var stack = [{ id: start, i: 0 }];
    color[start] = 1;
    while (stack.length) {
      var top = stack[stack.length - 1];
      var list = adj.succ[top.id];
      if (top.i >= list.length) { color[top.id] = 2; stack.pop(); continue; }
      var next = list[top.i++];
      if (color[next] === 1) {
        /* 回边。环里若有一条显式标了 kind:"retry" 的边，就反转它而不是 DFS 碰到的那条 ——
           否则主干会被拦腰截断，整张图左右颠倒。 */
        var from = -1;
        for (var i = 0; i < stack.length; i++) if (stack[i].id === next) { from = i; break; }
        var pick = null;
        if (from >= 0) {
          for (var k = from; k < stack.length; k++) {
            var nxt = k + 1 < stack.length ? stack[k + 1].id : next;
            var cand = edgeOf[stack[k].id + ' ' + nxt];
            if (cand && cand.kind === 'retry') { pick = cand; break; }
          }
        }
        if (pick) backSet[pick.from + ' ' + pick.to] = true;
        else backSet[top.id + ' ' + next] = true;
      }
      else if (!color[next]) { color[next] = 1; stack.push({ id: next, i: 0 }); }
    }
  }
  m.nodes.map(function (n) { return n.id; }).sort().forEach(function (id) {
    if (!color[id]) visit(id);
  });

  var count = 0;
  adj.edges.forEach(function (e) {
    if (backSet[e.from + ' ' + e.to]) { e.reversed = true; count++; }
  });
  return count;
}

/** 分层用的有向邻接（尊重 reversed） */
function dagAdjacency(m, adj) {
  var succ = {}, pred = {};
  m.nodes.forEach(function (n) { succ[n.id] = []; pred[n.id] = []; });
  adj.edges.forEach(function (e) {
    var a = e.reversed ? e.to : e.from;
    var b = e.reversed ? e.from : e.to;
    succ[a].push(b);
    pred[b].push(a);
  });
  return { succ: succ, pred: pred };
}

/** 最长路径分层 + 下拉一趟（让汇点落底，消掉阶梯感） */
function assignRanks(m, dag) {
  var ids = m.nodes.map(function (n) { return n.id; });
  var indeg = {}, rank = {};
  ids.forEach(function (id) { indeg[id] = dag.pred[id].length; rank[id] = 0; });

  var queue = ids.filter(function (id) { return indeg[id] === 0; }).sort();
  var topo = [];
  while (queue.length) {
    var id = queue.shift();
    topo.push(id);
    dag.succ[id].slice().sort().forEach(function (t) {
      if (rank[id] + 1 > rank[t]) rank[t] = rank[id] + 1;
      if (--indeg[t] === 0) queue.push(t);
    });
  }
  /* 断环后不该有剩余，真出现就按 0 处理而不是挂死 */
  ids.forEach(function (id) { if (!(id in rank)) { rank[id] = 0; topo.push(id); } });

  /* 下拉：反向拓扑，把每个节点尽量贴近它的后继 */
  for (var i = topo.length - 1; i >= 0; i--) {
    var v = topo[i];
    var s = dag.succ[v];
    if (!s.length) continue;
    var lowest = Infinity;
    s.forEach(function (u) { if (rank[u] - 1 < lowest) lowest = rank[u] - 1; });
    if (lowest < rank[v] && lowest >= 0) rank[v] = lowest;
  }

  /* 作者可以用 rank 覆盖 */
  m.nodes.forEach(function (n) {
    if (typeof n.rank === 'number' && isFinite(n.rank)) rank[n.id] = Math.max(0, Math.round(n.rank));
  });
  return rank;
}

/** 相邻两层之间的边交叉数 */
function countCrossings(upper, lower, dag) {
  var pos = {}, lpos = {};
  upper.forEach(function (id, i) { pos[id] = i; });
  lower.forEach(function (id, i) { lpos[id] = i; });
  var arr = [];
  upper.forEach(function (u) {
    dag.succ[u].forEach(function (v) {
      if (pos[v] === undefined && lpos[v] !== undefined) arr.push([pos[u], lpos[v]]);
    });
  });
  arr.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  var seq = arr.map(function (p) { return p[1]; });
  var count = 0;
  (function merge(a) {
    if (a.length < 2) return a;
    var mid = a.length >> 1;
    var l = merge(a.slice(0, mid)), r = merge(a.slice(mid));
    var out = [], i = 0, j = 0;
    while (i < l.length && j < r.length) {
      if (l[i] <= r[j]) out.push(l[i++]);
      else { count += l.length - i; out.push(r[j++]); }
    }
    return out.concat(l.slice(i), r.slice(j));
  })(seq);
  return count;
}

function totalCrossings(layers, dag) {
  var n = 0;
  for (var i = 0; i + 1 < layers.length; i++) n += countCrossings(layers[i], layers[i + 1], dag);
  return n;
}

/** 重心排序：下/上各两趟，保留交叉数最少的那个 */
function orderLayers(m, layers, dag) {
  var authorOrder = {};
  m.nodes.forEach(function (n) {
    authorOrder[n.id] = typeof n.order === 'number' && isFinite(n.order) ? n.order : n.index;
  });
  function byAuthor(a, b) {
    return (authorOrder[a] - authorOrder[b]) || (a < b ? -1 : a > b ? 1 : 0);
  }
  layers.forEach(function (layer) { layer.sort(byAuthor); });

  var best = layers.map(function (l) { return l.slice(); });
  var bestCount = totalCrossings(best, dag);

  function indexOf(layer) {
    var ix = {};
    layer.forEach(function (id, i) { ix[id] = i; });
    return ix;
  }

  for (var pass = 0; pass < 4; pass++) {
    var down = pass % 2 === 0;
    var order = layers.map(function (_, i) { return down ? i : layers.length - 1 - i; });
    order.forEach(function (li) {
      var other = layers[down ? li - 1 : li + 1];
      if (!other) return;
      var ix = indexOf(other);
      var neigh = down ? dag.pred : dag.succ;
      var self = indexOf(layers[li]);
      layers[li].sort(function (a, b) {
        return (bary(a) - bary(b)) || byAuthor(a, b);
      });
      function bary(id) {
        var ns = neigh[id] || [];
        var sum = 0, cnt = 0;
        ns.forEach(function (u) { if (ix[u] !== undefined) { sum += ix[u]; cnt++; } });
        return cnt ? sum / cnt : self[id];
      }
    });
    var c = totalCrossings(layers, dag);
    if (c < bestCount) { bestCount = c; best = layers.map(function (l) { return l.slice(); }); }
  }
  return { layers: best, crossings: bestCount };
}

/** 组内连续化：同组节点在每层里聚成一块，分组框才能自然包住它们 */
function groupAwareOrder(m, layers) {
  var groupRank = {};
  m.groups.forEach(function (g, i) { groupRank[g.id] = i; });
  layers.forEach(function (layer) {
    /* 稳定排序：同组内保持既有相对顺序 */
    layer.sort(function (a, b) {
      var ga = m.byId[a] ? m.byId[a].group : null;
      var gb = m.byId[b] ? m.byId[b].group : null;
      var ha = ga != null && groupRank[ga] !== undefined ? groupRank[ga] : Infinity;
      var hb = gb != null && groupRank[gb] !== undefined ? groupRank[gb] : Infinity;
      return ha - hb;
    });
  });
  return layers;
}

/* ── 坐标分配 ─────────────────────────────────────────── */

/** 一维打包：按 size 依次排开并居中 */
function packAxis(items, gap, center) {
  var total = 0;
  items.forEach(function (it, i) {
    if (i) total += gap;
    total += it.size;
  });
  var cursor = center - total / 2;
  items.forEach(function (it) {
    it.pos = cursor;
    cursor += it.size + gap;
  });
  return total;
}

/** 就地向右推开重叠（entries 需已按 pos 升序） */
function resolveOverlaps(entries, gap) {
  for (var i = 1; i < entries.length; i++) {
    var minPos = entries[i - 1].pos + entries[i - 1].size + gap;
    if (entries[i].pos < minPos) entries[i].pos = minPos;
  }
}

/** 优先级坐标：先取邻居中位数当理想位置，再消重叠 —— 这是让边变直的关键 */
function assignCrossAxis(m, layers, boxes, dag, horizontal) {
  var sizeOf = function (id) { return horizontal ? boxes[id].h : boxes[id].w; };
  var pos = {}, center = {};

  var widest = 0;
  layers.forEach(function (layer) {
    var items = layer.map(function (id) { return { id: id, size: sizeOf(id) }; });
    widest = Math.max(widest, packAxis(items, SPACING.node, 0));
  });
  layers.forEach(function (layer) {
    var items = layer.map(function (id) { return { id: id, size: sizeOf(id) }; });
    packAxis(items, SPACING.node, widest / 2);
    items.forEach(function (it) { pos[it.id] = it.pos; center[it.id] = it.pos + it.size / 2; });
  });

  for (var pass = 0; pass < 6; pass++) {
    var down = pass % 2 === 0;
    var order = layers.map(function (_, i) { return down ? i : layers.length - 1 - i; });
    order.forEach(function (li) {
      if (down ? li === 0 : li === layers.length - 1) return;
      var neigh = down ? dag.pred : dag.succ;
      var layer = layers[li];
      var items = layer.map(function (id) {
        var ns = (neigh[id] || []).filter(function (u) { return center[u] !== undefined; });
        var ideal = center[id];
        if (ns.length) {
          var cs = ns.map(function (u) { return center[u]; }).sort(function (a, b) { return a - b; });
          ideal = cs[cs.length >> 1];
        }
        return { id: id, size: sizeOf(id), ideal: ideal };
      });
      items.sort(function (a, b) { return (a.ideal - b.ideal) || (a.id < b.id ? -1 : 1); });
      items.forEach(function (it) { it.pos = it.ideal - it.size / 2; });
      resolveOverlaps(items, SPACING.node);
      items.forEach(function (it) { pos[it.id] = it.pos; center[it.id] = it.pos + it.size / 2; });
      items.forEach(function (it, i) { layer[i] = it.id; });   // 回写层顺序
    });
  }
  return pos;
}

/* ── 策略：架构图 ─────────────────────────────────────── */

function layoutArchitecture(m) {
  var horizontal = m.direction === 'LR' || m.direction === 'RL';
  var flip = m.direction === 'RL' || m.direction === 'BT';

  /* 1. 节点框由标签内容推导，作者不给尺寸 */
  var boxes = {};
  m.nodes.forEach(function (n) {
    var b = measure.nodeBox(n, { maxTextW: horizontal ? 148 : 172 });
    boxes[n.id] = { id: n.id, w: b.w, h: b.h, lines: b.lines, subLines: b.subLines, node: n };
  });

  /* 2. 邻接 + 断环 */
  var adj = buildAdjacency(m);
  var backCount = breakCycles(m, adj);
  var dag = dagAdjacency(m, adj);

  /* 3. 分层 */
  var rank = assignRanks(m, dag);
  var maxRank = 0;
  Object.keys(rank).forEach(function (id) { maxRank = Math.max(maxRank, rank[id]); });
  var layers = [];
  for (var r = 0; r <= maxRank; r++) layers.push([]);
  m.nodes.forEach(function (n) { layers[rank[n.id]].push(n.id); });

  /* 4. 排序：先组内连续化，再重心优化，再连续化一次 */
  groupAwareOrder(m, layers);
  var ordered = orderLayers(m, layers, dag);
  layers = groupAwareOrder(m, ordered.layers);

  /* 5. 坐标 */
  var rankSize = layers.map(function (layer) {
    return layer.reduce(function (mx, id) {
      return Math.max(mx, horizontal ? boxes[id].w : boxes[id].h);
    }, 0);
  });
  var rankPos = [], cursor = 0;
  rankSize.forEach(function (size) { rankPos.push(cursor); cursor += size + SPACING.rank; });
  var mainExtent = Math.max(0, cursor - SPACING.rank);
  var crossPos = assignCrossAxis(m, layers, boxes, dag, horizontal);

  /* 6. 落位 */
  var scene = {
    kind: m.kind, direction: m.direction, horizontal: horizontal,
    nodes: [], edges: [], groups: [], bands: [],
    stats: { crossings: ordered.crossings, layers: layers.length, backEdges: backCount, degradedRoutes: 0 }
  };
  layers.forEach(function (layer, li) {
    layer.forEach(function (id) {
      var b = boxes[id];
      var main = rankPos[li] + (rankSize[li] - (horizontal ? b.w : b.h)) / 2;
      var cross = crossPos[id];
      var x = horizontal ? main : cross;
      var y = horizontal ? cross : main;
      if (flip) {
        if (horizontal) x = mainExtent - x - b.w;
        else y = mainExtent - y - b.h;
      }
      scene.nodes.push({
        id: id, label: b.node.label, sublabel: b.node.sublabel, kind: b.node.kind,
        group: b.node.group, shape: shapeFor(b.node, m.kind),
        x: r1(x), y: r1(y), w: b.w, h: b.h,
        lines: b.lines, subLines: b.subLines,
        cx: r1(x + b.w / 2), cy: r1(y + b.h / 2),
        rank: li
      });
    });
  });
  scene.byId = {};
  scene.nodes.forEach(function (n) { scene.byId[n.id] = n; });

  /* 7. 分组框：成员包围盒 + 内边距 */
  scene.groups = buildGroupBoxes(m, scene);

  /* 8. 归一化到正坐标 + viewBox */
  frameScene(scene, m);
  return scene;
}

function shapeFor(node, kind) {
  if (kind === 'workflow') {
    if (node.kind === 'decision') return 'diamond';
    if (node.kind === 'start' || node.kind === 'end') return 'pill';
  }
  if (kind === 'lifecycle' && node.kind === 'terminal') return 'pill';
  return 'rect';
}

/** 分组框 = 成员包围盒 + 非对称内边距（有标题时顶部多留） */
function buildGroupBoxes(m, scene) {
  var out = [];
  m.groups.forEach(function (g) {
    var members = scene.nodes.filter(function (n) { return n.group === g.id; });
    if (!members.length) return;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    members.forEach(function (n) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
    });
    var padTop = g.label ? SPACING.groupTitle : SPACING.groupPad;
    out.push({
      id: g.id, label: g.label,
      x: r1(minX - SPACING.groupPad), y: r1(minY - padTop),
      w: r1(maxX - minX + SPACING.groupPad * 2),
      h: r1(maxY - minY + padTop + SPACING.groupPad),
      members: members.map(function (n) { return n.id; })
    });
  });
  return out;
}

/** 平移整个场景到正坐标，算出 viewBox */
function frameScene(scene, m) {
  var minX = 0, minY = 0, maxX = 0, maxY = 0, first = true;
  function include(x, y, w, h) {
    if (first) { minX = x; minY = y; maxX = x + w; maxY = y + h; first = false; return; }
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
  }
  scene.nodes.forEach(function (n) { include(n.x, n.y, n.w, n.h); });
  scene.groups.forEach(function (g) { include(g.x, g.y, g.w, g.h); });
  if (first) include(0, 0, 320, 200);

  var dx = SPACING.margin - minX, dy = SPACING.margin - minY;
  scene.nodes.forEach(function (n) {
    n.x = r1(n.x + dx); n.y = r1(n.y + dy);
    n.cx = r1(n.cx + dx); n.cy = r1(n.cy + dy);
  });
  scene.groups.forEach(function (g) { g.x = r1(g.x + dx); g.y = r1(g.y + dy); });

  var w = Math.ceil(maxX - minX + SPACING.margin * 2);
  var h = Math.ceil(maxY - minY + SPACING.margin * 2);
  if (m.viewBox) { w = m.viewBox[2]; h = m.viewBox[3]; }   // 作者指定 = 裁剪
  scene.width = w;
  scene.height = h;
  return scene;
}

/* ── 策略：freeform ───────────────────────────────────── */

/** 作者给了 pos 就用，没给的退回自动排一行 */
function layoutFreeform(m) {
  var scene = {
    kind: 'freeform', direction: m.direction, horizontal: false,
    nodes: [], edges: [], groups: [], bands: [],
    stats: { crossings: 0, layers: 1, backEdges: 0, degradedRoutes: 0 }
  };
  var auto = [];
  m.nodes.forEach(function (n) {
    var b = measure.nodeBox(n, { maxTextW: 172 });
    if (!n.pos) { auto.push({ n: n, b: b }); return; }
    var w = n.size ? n.size[0] : b.w, h = n.size ? n.size[1] : b.h;
    scene.nodes.push({
      id: n.id, label: n.label, sublabel: n.sublabel, kind: n.kind, group: n.group,
      shape: shapeFor(n, 'freeform'),
      x: r1(n.pos[0]), y: r1(n.pos[1]), w: w, h: h,
      lines: b.lines, subLines: b.subLines,
      cx: r1(n.pos[0] + w / 2), cy: r1(n.pos[1] + h / 2), rank: 0
    });
  });
  if (auto.length) {
    var x = SPACING.margin;
    var y = scene.nodes.reduce(function (mx, n) { return Math.max(mx, n.y + n.h); }, 0) +
            (scene.nodes.length ? SPACING.node : 0);
    auto.forEach(function (item) {
      scene.nodes.push({
        id: item.n.id, label: item.n.label, sublabel: item.n.sublabel,
        kind: item.n.kind, group: item.n.group, shape: shapeFor(item.n, 'freeform'),
        x: r1(x), y: r1(y), w: item.b.w, h: item.b.h,
        lines: item.b.lines, subLines: item.b.subLines,
        cx: r1(x + item.b.w / 2), cy: r1(y + item.b.h / 2), rank: 0
      });
      x += item.b.w + SPACING.node;
    });
  }
  scene.byId = {};
  scene.nodes.forEach(function (n) { scene.byId[n.id] = n; });
  scene.groups = buildGroupBoxes(m, scene);
  frameScene(scene, m);
  return scene;
}

/* ── 策略：时序图 ─────────────────────────────────────── */

/* 参与者 = 固定列，消息 = 按顺序累加的行。
   作者不写 y —— 顺序即时间顺序。边在策略里就算好，不走通用路由器。 */

function layoutSequence(m) {
  var pad = SPACING.margin;
  var headerH = 46;
  var msgGap = 40;
  var selfGap = 52;
  var colGap = 56;

  var cols = m.participants.length ? m.participants : m.nodes;
  var widths = cols.map(function (p) {
    return Math.max(104, measure.width(p.label, 13) + 36);
  });
  var x = pad, centers = {}, colX = {};
  cols.forEach(function (p, i) {
    colX[p.id] = x;
    centers[p.id] = x + widths[i] / 2;
    x += widths[i] + colGap;
  });
  var totalW = x - colGap + pad;

  var topY = pad;
  var msgTop = topY + headerH + 30;
  var y = msgTop;
  var msgs = m.edges.slice().sort(function (a, b) { return a.index - b.index; });

  msgs.forEach(function (e) {
    if (!centers[e.from] || !centers[e.to]) return;
    y += (e.from === e.to ? selfGap : msgGap);
    e._y = y;
  });
  var bottomY = y + 34;

  var scene = {
    kind: 'sequence', direction: 'TB', horizontal: false, routed: true,
    nodes: [], edges: [], groups: [], bands: [], lifelines: [], activations: [], blocks: [],
    width: 0, height: 0,
    stats: { crossings: 0, layers: cols.length, backEdges: 0, degradedRoutes: 0 }
  };

  cols.forEach(function (p, i) {
    scene.nodes.push({
      id: p.id, label: p.label, sublabel: p.sublabel, kind: p.kind,
      group: null, shape: 'rect',
      x: r1(colX[p.id]), y: r1(topY), w: widths[i], h: headerH,
      lines: measure.wrap(p.label, 160, { size: 13, maxLines: 2 }), subLines: [],
      cx: r1(centers[p.id]), cy: r1(topY + headerH / 2), rank: i
    });
    scene.lifelines.push({ id: p.id, x: r1(centers[p.id]), y0: r1(topY + headerH), y1: r1(bottomY) });
  });
  scene.byId = {};
  scene.nodes.forEach(function (n) { scene.byId[n.id] = n; });

  /* 消息：水平箭头，两端各留 7px 让箭头不被生命线压住 */
  msgs.forEach(function (e) {
    if (e._y == null) return;
    var a = centers[e.from], b = centers[e.to];
    var pts, selfLoop = e.from === e.to;
    if (selfLoop) {
      pts = [[a, e._y - 14], [a + 42, e._y - 14], [a + 42, e._y + 6], [a + 2, e._y + 6]];
    } else {
      var dir = b > a ? 1 : -1;
      pts = [[a + dir * 7, e._y], [b - dir * 7, e._y]];
    }
    scene.edges.push({
      id: e.id, from: e.from, to: e.to, label: e.label,
      variant: e.kind === 'return' ? 'dashed' : e.variant,
      kind: e.kind, reversed: false,
      fromSide: 'right', toSide: 'left',
      points: pts, d: route.pathData(pts, 6),
      labelAt: e.label ? {
        x: r1((pts[0][0] + pts[pts.length - 1][0]) / 2),
        y: r1(e._y - 10),
        w: Math.ceil(measure.width(e.label, 11) + 8),
        h: 19, text: e.label
      } : null,
      degraded: false, index: e.index
    });
  });

  /* 激活条：参与者从第一次被卷入到最后一次被卷入 */
  var involved = {};
  msgs.forEach(function (e, i) {
    [e.from, e.to].forEach(function (id) {
      if (!involved[id]) involved[id] = { first: i, last: i, count: 0 };
      involved[id].last = i;
      involved[id].count++;
    });
  });
  Object.keys(involved).forEach(function (id) {
    if (involved[id].count < 2 || !centers[id]) return;
    var first = msgs[involved[id].first], last = msgs[involved[id].last];
    if (first._y == null || last._y == null) return;
    scene.activations.push({
      id: id, x: r1(centers[id] - 5),
      y0: r1(first._y - 14), y1: r1(last._y + 14)
    });
  });

  /* opt / loop / alt 块 */
  (m.blocks || []).forEach(function (b) {
    var from = msgs[b.from], to = msgs[b.to];
    if (!from || !to || from._y == null || to._y == null) return;
    var ids = msgs.slice(b.from, b.to + 1)
      .reduce(function (acc, e) { acc[e.from] = 1; acc[e.to] = 1; return acc; }, {});
    var xs = Object.keys(ids).map(function (id) { return centers[id]; }).filter(isFinite);
    if (!xs.length) return;
    var minX = Math.min.apply(null, xs) - 26, maxX = Math.max.apply(null, xs) + 26;
    scene.blocks.push({
      kind: b.kind || 'opt', label: b.label || b.kind || 'opt',
      x: r1(minX), y: r1(from._y - 22),
      w: r1(maxX - minX), h: r1(to._y - from._y + 44)
    });
  });

  scene.width = Math.ceil(totalW);
  scene.height = Math.ceil(bottomY + pad);
  return scene;
}

/* ── 策略：状态机 ─────────────────────────────────────── */

/* 三条带：相位（顶）→ 事件（中）→ 终态（底）。
   带高与列宽都由内容算，不是硬编码表。 */

function layoutLifecycle(m) {
  var pad = SPACING.margin;
  var phases = m.phases.length ? m.phases : [{ id: 'p0', label: '' }];
  var events = m.nodes.filter(function (n) { return n.kind !== 'terminal' && !m.outcomes.some(function (o) { return o.id === n.id; }); });
  var terminals = m.nodes.filter(function (n) { return n.kind === 'terminal'; });

  /* 每个相位一列；同相位多个事件则加宽该列 */
  var perPhase = {};
  events.forEach(function (n) {
    var key = n.phase != null ? String(n.phase) : phases[0].id;
    (perPhase[key] = perPhase[key] || []).push(n);
  });
  var boxes = {};
  m.nodes.forEach(function (n) {
    var b = measure.nodeBox(n, { maxTextW: 140 });
    boxes[n.id] = b;
  });

  var phaseW = phases.map(function (p) {
    var list = perPhase[p.id] || [];
    var maxW = list.reduce(function (mx, n) { return Math.max(mx, boxes[n.id].w); }, 96);
    return Math.max(150, maxW + 28);
  });
  var totalW = phaseW.reduce(function (a, b) { return a + b; }, 0) + pad * 2;

  var phaseY = pad;
  var phaseH = 34;
  var eventY = phaseY + phaseH + 34;
  var eventH = Math.max(60, events.reduce(function (mx, n) { return Math.max(mx, boxes[n.id].h); }, 44));
  var outcomeY = eventY + eventH + 64;
  var outcomeH = Math.max(44, terminals.reduce(function (mx, n) { return Math.max(mx, boxes[n.id].h); }, 44));
  var totalH = outcomeY + outcomeH + pad + 20;

  var scene = {
    kind: 'lifecycle', direction: 'TB', horizontal: false,
    nodes: [], edges: [], groups: [], bands: [],
    width: Math.ceil(totalW), height: Math.ceil(totalH),
    stats: { crossings: 0, layers: phases.length, backEdges: 0, degradedRoutes: 0 }
  };

  var x = pad;
  var colCenter = {};
  phases.forEach(function (p, i) {
    var w = phaseW[i];
    scene.bands.push({
      kind: 'phase', id: p.id, label: p.label,
      x: r1(x), y: r1(phaseY), w: r1(w), h: r1(phaseH)
    });
    colCenter[p.id] = x + w / 2;
    x += w;
  });

  /* 事件：同相位内多个则纵向堆叠并居中 */
  Object.keys(perPhase).forEach(function (key) {
    var list = perPhase[key];
    var cx = colCenter[key] != null ? colCenter[key] : totalW / 2;
    var totalHStack = list.reduce(function (a, n) { return a + boxes[n.id].h; }, 0) + (list.length - 1) * 22;
    var y0 = eventY + (eventH - totalHStack) / 2;
    list.forEach(function (n) {
      var b = boxes[n.id];
      scene.nodes.push({
        id: n.id, label: n.label, sublabel: n.sublabel, kind: n.kind,
        group: null, shape: 'rect',
        x: r1(cx - b.w / 2), y: r1(y0), w: b.w, h: b.h,
        lines: b.lines, subLines: b.subLines,
        cx: r1(cx), cy: r1(y0 + b.h / 2), rank: 1
      });
      y0 += b.h + 22;
    });
  });

  /* 终态：对齐到它来源相位的下方，而不是居中聚成一堆 ——
     否则从最右相位到中间的终态会横穿整个事件带。 */
  if (terminals.length) {
    var sourceX = {};
    terminals.forEach(function (n) {
      var preds = m.edges.filter(function (e) { return e.to === n.id && e.from !== n.id; });
      var xs = preds.map(function (e) {
        var src = events.filter(function (x) { return x.id === e.from; })[0];
        if (!src) return null;
        var key = src.phase != null ? String(src.phase) : phases[0].id;
        return colCenter[key];
      }).filter(isFinite);
      sourceX[n.id] = xs.length ? xs.reduce(function (a, b) { return a + b; }, 0) / xs.length : totalW / 2;
    });
    var ordered = terminals.slice().sort(function (a, b) {
      return (sourceX[a.id] - sourceX[b.id]) || (a.id < b.id ? -1 : 1);
    });
    ordered.forEach(function (n) {
      var b = boxes[n.id];
      var cx = util.clamp(sourceX[n.id], pad + b.w / 2, totalW - pad - b.w / 2);
      scene.nodes.push({
        id: n.id, label: n.label, sublabel: n.sublabel, kind: 'terminal',
        group: null, shape: 'pill',
        x: r1(cx - b.w / 2), y: r1(outcomeY), w: b.w, h: b.h,
        lines: b.lines, subLines: b.subLines,
        cx: r1(cx), cy: r1(outcomeY + b.h / 2), rank: 2
      });
    });
  }

  scene.byId = {};
  scene.nodes.forEach(function (n) { scene.byId[n.id] = n; });
  scene.bandLabel = 'phase';
  return scene;
}

/* ── 策略：数据流 ─────────────────────────────────────── */

/* 阶段 = 列，节点按 row 在阶段内堆叠；列宽按内容算。 */

function layoutDataflow(m) {
  var pad = SPACING.margin;
  var stages = m.stages.length ? m.stages : [{ id: 's0', label: '' }];
  var boxes = {};
  m.nodes.forEach(function (n) { boxes[n.id] = measure.nodeBox(n, { maxTextW: 150 }); });

  var perStage = {};
  m.nodes.forEach(function (n) {
    var key = n.stage != null ? String(n.stage) : stages[0].id;
    (perStage[key] = perStage[key] || []).push(n);
  });

  var stageW = stages.map(function (s) {
    var list = perStage[s.id] || [];
    return Math.max(170, list.reduce(function (mx, n) { return Math.max(mx, boxes[n.id].w); }, 120) + 40);
  });
  var stageHeaderH = 34;
  var rowGap = 34;
  var maxRows = Math.max(1, ...stages.map(function (s) { return (perStage[s.id] || []).length; }));
  var rowH = Math.max.apply(null, m.nodes.map(function (n) { return boxes[n.id].h; }).concat([48]));
  var bodyTop = pad + stageHeaderH + 28;
  var totalH = bodyTop + maxRows * rowH + (maxRows - 1) * rowGap + pad;
  var totalW = stageW.reduce(function (a, b) { return a + b; }, 0) + pad * 2;

  var scene = {
    kind: 'dataflow', direction: 'LR', horizontal: true,
    nodes: [], edges: [], groups: [], bands: [],
    width: Math.ceil(totalW), height: Math.ceil(totalH),
    stats: { crossings: 0, layers: stages.length, backEdges: 0, degradedRoutes: 0 }
  };

  var x = pad;
  stages.forEach(function (s, i) {
    var w = stageW[i];
    scene.bands.push({
      kind: 'stage', id: s.id, label: s.label,
      x: r1(x), y: r1(pad), w: r1(w), h: r1(totalH - pad * 2)
    });
    var list = perStage[s.id] || [];
    var stackH = list.reduce(function (a, n) { return a + boxes[n.id].h; }, 0) + (list.length - 1) * rowGap;
    var y0 = bodyTop + Math.max(0, (maxRows * rowH + (maxRows - 1) * rowGap - stackH) / 2);
    list.forEach(function (n) {
      var b = boxes[n.id];
      var cx = x + w / 2;
      scene.nodes.push({
        id: n.id, label: n.label, sublabel: n.sublabel, kind: n.kind,
        group: null, shape: 'rect',
        x: r1(cx - b.w / 2), y: r1(y0), w: b.w, h: b.h,
        lines: b.lines, subLines: b.subLines,
        cx: r1(cx), cy: r1(y0 + b.h / 2), rank: i
      });
      y0 += b.h + rowGap;
    });
    x += w;
  });

  scene.byId = {};
  scene.nodes.forEach(function (n) { scene.byId[n.id] = n; });
  return scene;
}

/* ── 策略：泳道流程 ───────────────────────────────────── */

/* 泳道 = 横向带，步骤按 DAG 最长路径分列；决策节点用菱形。 */

function layoutWorkflow(m) {
  var pad = SPACING.margin;
  var lanes = m.lanes.length ? m.lanes : [{ id: 'l0', label: '' }];
  var boxes = {};
  m.nodes.forEach(function (n) {
    var b = measure.nodeBox(n, { maxTextW: 132 });
    if (n.kind === 'decision') { b.w += 26; b.h += 20; }   // 菱形要多留对角空间
    boxes[n.id] = b;
  });

  /* 列号：DAG 最长路径 */
  var adj = buildAdjacency(m);
  breakCycles(m, adj);
  var dag = dagAdjacency(m, adj);
  var rank = assignRanks(m, dag);
  var maxRank = 0;
  Object.keys(rank).forEach(function (id) { maxRank = Math.max(maxRank, rank[id]); });

  var byRank = [];
  for (var r = 0; r <= maxRank; r++) byRank.push([]);
  m.nodes.forEach(function (n) { byRank[rank[n.id]].push(n.id); });

  var colW = byRank.map(function (list) {
    return Math.max(130, list.reduce(function (mx, id) { return Math.max(mx, boxes[id].w); }, 100) + 46);
  });
  var colX = [], cursor = pad;
  colW.forEach(function (w) { colX.push(cursor); cursor += w; });
  var totalW = cursor - colW[colW.length - 1] + colW[colW.length - 1] + pad;

  var laneHeaderH = 26;
  var laneH = lanes.map(function (l) {
    var list = m.nodes.filter(function (n) { return n.lane === l.id; });
    return Math.max(78, list.reduce(function (mx, n) { return Math.max(mx, boxes[n.id].h); }, 52) + 26 + laneHeaderH);
  });
  var laneY = [], cy = pad;
  laneH.forEach(function (h) { laneY.push(cy); cy += h; });
  var totalH = cy + pad;

  var scene = {
    kind: 'workflow', direction: 'LR', horizontal: true,
    nodes: [], edges: [], groups: [], bands: [],
    width: Math.ceil(totalW), height: Math.ceil(totalH),
    stats: { crossings: 0, layers: byRank.length, backEdges: 0, degradedRoutes: 0 }
  };

  lanes.forEach(function (l, i) {
    scene.bands.push({
      kind: 'lane', id: l.id, label: l.label,
      x: r1(pad), y: r1(laneY[i]), w: r1(totalW - pad * 2), h: r1(laneH[i])
    });
  });

  var laneIndex = {};
  lanes.forEach(function (l, i) { laneIndex[l.id] = i; });

  byRank.forEach(function (list, ri) {
    /* 同层里不同泳道的节点各占各的行，不能一起堆叠 —— 否则会挤出泳道底边 */
    var perLane = {};
    list.forEach(function (id) {
      var lane = m.byId[id].lane;
      var key = lane != null ? String(lane) : '__none';
      (perLane[key] = perLane[key] || []).push(id);
    });
    Object.keys(perLane).forEach(function (key) {
    var laneList = perLane[key];
    laneList.forEach(function (id, k) {
      var n = m.byId[id], b = boxes[id];
      var li = laneIndex[n.lane] != null ? laneIndex[n.lane] : 0;
      var cx = colX[ri] + colW[ri] / 2;
      var usableTop = laneY[li] + laneHeaderH;
      var usableH = laneH[li] - laneHeaderH;
      var totalStack = laneList.length * b.h + (laneList.length - 1) * 16;
      var y0 = usableTop + Math.max(6, (usableH - totalStack) / 2) + k * (b.h + 16);
      scene.nodes.push({
        id: id, label: n.label, sublabel: n.sublabel, kind: n.kind,
        group: null, shape: shapeFor(n, 'workflow'),
        x: r1(cx - b.w / 2), y: r1(y0), w: b.w, h: b.h,
        lines: b.lines, subLines: b.subLines,
        cx: r1(cx), cy: r1(y0 + b.h / 2), rank: ri
      });
    });
    });
  });

  scene.byId = {};
  scene.nodes.forEach(function (n) { scene.byId[n.id] = n; });
  return scene;
}

/* ── 入口 ─────────────────────────────────────────────── */

layout.run = function (m) {
  if (!m || !m.nodes || !m.nodes.length) {
    return {
      kind: m ? m.kind : 'architecture', direction: 'TB', horizontal: false,
      nodes: [], edges: [], groups: [], bands: [],
      width: 320, height: 200, byId: {},
      stats: { crossings: 0, layers: 0, backEdges: 0, degradedRoutes: 0 }
    };
  }
  var scene;
  switch (m.kind) {
    case 'sequence':  scene = layoutSequence(m); break;
    case 'lifecycle': scene = layoutLifecycle(m); break;
    case 'dataflow':  scene = layoutDataflow(m); break;
    case 'workflow':  scene = layoutWorkflow(m); break;
    case 'freeform':  scene = layoutFreeform(m); break;
    default:          scene = layoutArchitecture(m);
  }
  /* 时序图的边在策略里就算好了（水平箭头，不走通用正交路由器） */
  return scene.routed ? scene : route.attach(scene, m);
};

/* ── route ────────────────────────────────────────────── */

/* 正交路由器。几何由布局给出，这里只负责「怎么连」。
   同样 DOM-free —— check.mjs 要在 Node 里跑它并断言不穿节点。 */

var ROUTE = {
  stub: 20,          // 出线长度：侧向契约由它保证，不靠事后校验
  minSeg: 16,        // 多段路径里任何一段都不得短于此 —— 等于 2 * corner
  microSeg: 8,       // 任何一段都不得短于此，单段直连也不例外
  nodeClear: 8,      // 与无关节点的最小间隙
  labelClear: 4,     // 标签与边的间隙
  portMargin: 12,    // 端口离框角的余量（当前策略下不生效，见 assignPorts）
  maxPortGap: 12,    // 相邻端口的最大间距（当前策略下不生效，见 assignPorts）
  maxPerSide: 4,     // 单边超过这么多条边就把溢出挪到次优边
  outerStep: 12,     // 外圈通道被占用时每次外让的格距
  outerTries: 4,     // 外圈最多外让几格 —— 有界，每一格都会撑大 viewBox
  crossCell: 48,     // 交叉索引的网格边长（只影响速度，不影响结果）
  crossW: 1000,      // 交叉惩罚权重：窗口内绝对压制
  detourBudget: 500, // 为躲交叉允许多走的路程上限（相对本边最省的候选）。
                     //   实测：200 太紧（大图上反而更差），500 与 800 结果相同 —— 已饱和。
  shareW: 1.5,       // 通道共用的每像素代价
  shareCap: 200,     // 通道惩罚上限。必须远小于 crossW：一次交叉永远压过通道共用的总惩罚
  corner: 8          // 圆角半径
};

var route = Craft.route = {};

/* ── 基础几何 ─────────────────────────────────────────── */

function dirOf(side) {
  return side === 'left' ? [-1, 0] : side === 'right' ? [1, 0]
       : side === 'top' ? [0, -1] : [0, 1];
}
function isVerticalSide(side) { return side === 'left' || side === 'right'; }

function anchorAt(box, side, t) {
  switch (side) {
    case 'left':   return [box.x, box.y + box.h * t];
    case 'right':  return [box.x + box.w, box.y + box.h * t];
    case 'top':    return [box.x + box.w * t, box.y];
    default:       return [box.x + box.w * t, box.y + box.h];
  }
}

/** 两点相对位置决定的默认朝向 —— 就是偏好序的第一位，不再单独实现一遍 */
function autoSide(from, to) { return sideRank(from, to)[0]; }

function sideRank(from, to) {
  var dx = to.cx - from.cx, dy = to.cy - from.cy;
  var horiz = Math.abs(dx) >= Math.abs(dy);
  var primary = horiz ? (dx >= 0 ? 'right' : 'left') : (dy >= 0 ? 'bottom' : 'top');
  var secondary = horiz ? (dy >= 0 ? 'bottom' : 'top') : (dx >= 0 ? 'right' : 'left');
  var tertiary = horiz ? (dy >= 0 ? 'top' : 'bottom') : (dx >= 0 ? 'left' : 'right');
  return [primary, secondary, tertiary];
}

function segHitsRect(p, q, rect, pad) {
  pad = pad || 0;
  var x0 = rect.x - pad, y0 = rect.y - pad;
  var x1 = rect.x + rect.w + pad, y1 = rect.y + rect.h + pad;
  var minx = Math.min(p[0], q[0]), maxx = Math.max(p[0], q[0]);
  var miny = Math.min(p[1], q[1]), maxy = Math.max(p[1], q[1]);
  if (maxx < x0 || minx > x1 || maxy < y0 || miny > y1) return false;
  /* 轴对齐线段与矩形：若线段在某轴上完全落在矩形内，则视为相交 */
  var horiz = Math.abs(p[1] - q[1]) < 1e-6;
  if (horiz) return p[1] >= y0 && p[1] <= y1 && maxx > x0 && minx < x1;
  var vert = Math.abs(p[0] - q[0]) < 1e-6;
  if (vert) return p[0] >= x0 && p[0] <= x1 && maxy > y0 && miny < y1;
  return false;   // 只处理正交段
}

function segLen(p, q) { return Math.abs(q[0] - p[0]) + Math.abs(q[1] - p[1]); }

/** 去掉共线的中间点，并保证每段长度有限 */
function simplify(pts) {
  var out = [];
  for (var i = 0; i < pts.length; i++) {
    var p = [r1(pts[i][0]), r1(pts[i][1])];
    if (out.length && p[0] === out[out.length - 1][0] && p[1] === out[out.length - 1][1]) continue;
    out.push(p);
  }
  var res = [out[0]];
  for (var j = 1; j < out.length - 1; j++) {
    var a = res[res.length - 1], b = out[j], c = out[j + 1];
    var collinear = (Math.abs(a[0] - b[0]) < 1e-6 && Math.abs(b[0] - c[0]) < 1e-6) ||
                    (Math.abs(a[1] - b[1]) < 1e-6 && Math.abs(b[1] - c[1]) < 1e-6);
    if (!collinear) res.push(b);
  }
  if (out.length > 1) res.push(out[out.length - 1]);
  return res;
}

/* ── 通道占用表 ───────────────────────────────────────── */

/* 正交边的每一段都落在一条「通道线」上：竖段落 x=常数的线，横段落 y=常数的线。
   占用表记录每条线上已被占用的区间 —— 故意不合并，重叠次数即深度，
   于是一条被三条边共用的通道自然付出三倍代价。纯数据，无 DOM。 */

/* 坐标量化到 0.5px 再当键：避免浮点噪声把同一条线拆成两条 */
function occKey(axis, v) { return axis + Math.round(v * 2); }

function occAdd(occ, pts) {
  for (var i = 0; i + 1 < pts.length; i++) {
    var p = pts[i], q = pts[i + 1];
    if (Math.abs(p[0] - q[0]) < 1e-6) {
      var k = occKey('V', p[0]);
      (occ[k] || (occ[k] = [])).push([Math.min(p[1], q[1]), Math.max(p[1], q[1])]);
    } else if (Math.abs(p[1] - q[1]) < 1e-6) {
      var k2 = occKey('H', p[1]);
      (occ[k2] || (occ[k2] = [])).push([Math.min(p[0], q[0]), Math.max(p[0], q[0])]);
    }
  }
}

/** 折线在已占通道上的重复里程 —— 共享越深，代价越高 */
function occOverlap(occ, pts) {
  var sum = 0;
  for (var i = 0; i + 1 < pts.length; i++) {
    var p = pts[i], q = pts[i + 1];
    var vert = Math.abs(p[0] - q[0]) < 1e-6;
    var list = occ[occKey(vert ? 'V' : 'H', vert ? p[0] : p[1])];
    if (!list) continue;
    var lo = Math.min(vert ? p[1] : p[0], vert ? q[1] : q[0]);
    var hi = Math.max(vert ? p[1] : p[0], vert ? q[1] : q[0]);
    for (var j = 0; j < list.length; j++) {
      var o = Math.min(hi, list[j][1]) - Math.max(lo, list[j][0]);
      if (o > 0) sum += o;
    }
  }
  return sum;
}

/** 某条通道线上是否已有实质占用 —— 只做存在性判断，用来挑一个空的外圈偏移 */
function occHasLine(occ, axis, v, lo, hi) {
  var list = occ[occKey(axis, v)];
  if (!list) return false;
  for (var i = 0; i < list.length; i++) {
    if (Math.min(hi, list[i][1]) - Math.max(lo, list[i][0]) > 1) return true;
  }
  return false;
}

/* ── 交叉索引 ─────────────────────────────────────────── */

/* 已放置边的段按网格分桶；查候选时只取它扫过的桶，把逐条比对从 O(E) 压到 O(1)。
   格子大小只影响速度，不影响结果 —— 取回的是超集，真正的相交判定仍走 segsCross。 */

/** 两条正交段是否真的交叉。严格不等号：端点相触、T 形搭接都不算 ——
    共享端口和共享拐角是正交路由的常态，罚它们会把所有候选一起罚。 */
function segsCross(a0, a1, b0, b1) {
  var aH = Math.abs(a0[1] - a1[1]) < 1e-6;
  var bH = Math.abs(b0[1] - b1[1]) < 1e-6;
  if (aH === bH) return false;                       // 平行 / 共线：不算交叉
  var h = aH ? [a0, a1] : [b0, b1];
  var v = aH ? [b0, b1] : [a0, a1];
  var hy = h[0][1];
  var hx0 = Math.min(h[0][0], h[1][0]), hx1 = Math.max(h[0][0], h[1][0]);
  var vx = v[0][0];
  var vy0 = Math.min(v[0][1], v[1][1]), vy1 = Math.max(v[0][1], v[1][1]);
  return vx > hx0 + 1e-6 && vx < hx1 - 1e-6 && hy > vy0 + 1e-6 && hy < vy1 - 1e-6;
}

function crossIndex(cell) {
  var buckets = {}, seq = 0;
  var C = cell || ROUTE.crossCell;
  function cells(p, q, fn) {
    var x0 = Math.floor(Math.min(p[0], q[0]) / C), x1 = Math.floor(Math.max(p[0], q[0]) / C);
    var y0 = Math.floor(Math.min(p[1], q[1]) / C), y1 = Math.floor(Math.max(p[1], q[1]) / C);
    for (var gx = x0; gx <= x1; gx++) for (var gy = y0; gy <= y1; gy++) fn(gx + ':' + gy);
  }
  return {
    /* 放置之后才写 —— 索引里的永远是「已放置」的边 */
    add: function (pts) {
      for (var i = 0; i + 1 < pts.length; i++) {
        var s = { p: pts[i], q: pts[i + 1], n: seq++ };
        cells(s.p, s.q, function (k) { (buckets[k] || (buckets[k] = [])).push(s); });
      }
    },
    count: function (pts) {
      var n = 0, seen = {};
      for (var i = 0; i + 1 < pts.length; i++) {
        var p = pts[i], q = pts[i + 1];
        cells(p, q, function (k) {
          var list = buckets[k]; if (!list) return;
          for (var j = 0; j < list.length; j++) {
            var s = list[j];
            if (seen[s.n]) continue;        // 同一段会落在多个桶里，只数一次
            seen[s.n] = 1;
            if (segsCross(p, q, s.p, s.q)) n++;
          }
        });
      }
      return n;
    }
  };
}

/** 场景里最终路由之间的实质交叉数 —— 与 stats.crossings（分层交叉）不是一回事 */
function routeCrossings(edges) {
  var total = 0;
  for (var i = 0; i < edges.length; i++) {
    for (var j = i + 1; j < edges.length; j++) {
      var A = edges[i].points, B = edges[j].points;
      for (var a = 0; a + 1 < A.length; a++) {
        for (var b = 0; b + 1 < B.length; b++) {
          if (segsCross(A[a], A[a + 1], B[b], B[b + 1])) total++;
        }
      }
    }
  }
  return total;
}

/* ── 路由顺序 ─────────────────────────────────────────── */

/* 「已放置」必须先有定义。用作者给的边序（edge.index）做主键：
   它是模型里唯一稳定、无歧义、且与拓扑无关的顺序。
   长边与回边走外圈通道，本来就不与相邻层的短边抢通道，
   所以不需要「难的先走」来抢位 —— 那反而会让示例的几何整体漂移。 */
function routeOrder(work) {
  return work.slice().sort(function (a, b) { return a.edge.index - b.edge.index; });
}

/** 外圈通道：基础 26px，被占用就再外让一格，最多 outerTries 格。
    只读占用表，不改 —— 候选生成必须是只读的，放置时才写。
    有界很重要：每一格都会把 viewBox 往外撑 outerStep px。 */
function outerOffset(ctx, axis, p0, p1, base, dir) {
  var lo = axis === 'V' ? Math.min(p0[1], p1[1]) : Math.min(p0[0], p1[0]);
  var hi = axis === 'V' ? Math.max(p0[1], p1[1]) : Math.max(p0[0], p1[0]);
  for (var k = 0; k < ROUTE.outerTries; k++) {
    var v = base + dir * (26 + k * ROUTE.outerStep);
    if (!occHasLine(ctx.occ, axis, v, lo, hi)) return v;
  }
  return base + dir * (26 + ROUTE.outerTries * ROUTE.outerStep);
}

/* ── 端口分配 ─────────────────────────────────────────── */

/** 单边溢出：某条边上挂的边太多时，把「最不该在这条边上」的成员挪到它自己的次优边。
    作者显式钉住的朝向不参与搬迁。有界且单调：无处可去就停，绝不硬挪。 */
function spillSides(work) {
  var cap = ROUTE.maxPerSide;
  if (!(cap > 0)) return 0;
  var groups = {};
  function keyOf(nodeId, side) { return nodeId + '|' + side; }
  function put(k, item) { (groups[k] || (groups[k] = [])).push(item); }

  work.forEach(function (r) {
    r.fromPref = sideRank(r.from, r.to);
    r.toPref = sideRank(r.to, r.from);
    put(keyOf(r.from.id, r.fromSide), { r: r, end: 'from', node: r.from.id, pref: r.fromPref, pinned: r.fromPinned });
    put(keyOf(r.to.id, r.toSide), { r: r, end: 'to', node: r.to.id, pref: r.toPref, pinned: r.toPinned });
  });

  var moved = 0;
  for (var guard = 0; guard < work.length; guard++) {
    /* 稳定遍历：字典序，不依赖对象键序 */
    var overKey = null;
    Object.keys(groups).sort().forEach(function (k) {
      if (overKey === null && groups[k].length > cap) overKey = k;
    });
    if (overKey === null) break;

    var list = groups[overKey];
    var side = overKey.slice(overKey.lastIndexOf('|') + 1);

    /* 搬谁：偏好排名最大者先搬（最不情愿待在这条边上的先走）；平局按 edge.index。
       注意这里**允许**搬走首选朝向的边 —— 一个 hub 扇出 8 条边到同一侧时，
       所有边的首选都是那一侧，若只搬「非首选」的边，规则等于不生效。 */
    var pick = null;
    list.forEach(function (it) {
      if (it.pinned) return;
      var rank = it.pref.indexOf(side);
      if (rank < 0) return;                     // 不在偏好序里，不动
      if (!pick || rank > pick.rank ||
          (rank === pick.rank && it.r.edge.index < pick.it.r.edge.index)) pick = { it: it, rank: rank };
    });
    if (!pick) break;                           // 全是钉住的：放弃

    var target = null;
    for (var i = pick.rank + 1; i < pick.it.pref.length; i++) {
      if ((groups[keyOf(pick.it.node, pick.it.pref[i])] || []).length < cap) { target = pick.it.pref[i]; break; }
    }
    if (!target) break;                         // 无处可去，保持原样

    list.splice(list.indexOf(pick.it), 1);
    if (pick.it.end === 'from') pick.it.r.fromSide = target; else pick.it.r.toSide = target;
    put(keyOf(pick.it.node, target), pick.it);
    moved++;
  }
  return moved;
}

/** 把边按 (节点, 朝向) 分组，同组内按对端位置均匀铺开 —— 扇出才不会叠在一起。
    单边过载时先由 spillSides 把溢出的边挪到次优边，再在这里铺端口。 */
function assignPorts(scene, edges) {
  edges.forEach(function (r) {
    r.fromPinned = !!(r.edge.fromSide && r.edge.fromSide !== 'auto');
    r.toPinned = !!(r.edge.toSide && r.edge.toSide !== 'auto');
    r.fromSide = r.fromPinned ? r.edge.fromSide : autoSide(r.from, r.to);
    r.toSide = r.toPinned ? r.edge.toSide : autoSide(r.to, r.from);
  });

  spillSides(edges);

  var groups = {};
  function key(nodeId, side) { return nodeId + '|' + side; }
  function push(nodeId, side, rec) {
    var k = key(nodeId, side);
    (groups[k] = groups[k] || []).push(rec);
  }
  edges.forEach(function (r) {
    push(r.from.id, r.fromSide, { r: r, end: 'from' });
    push(r.to.id, r.toSide, { r: r, end: 'to' });
  });

  Object.keys(groups).sort().forEach(function (k) {
    var list = groups[k];
    var side = k.slice(k.lastIndexOf('|') + 1);
    var vertical = isVerticalSide(side);
    list.sort(function (a, b) {
      var ao = a.end === 'from' ? a.r.to : a.r.from;
      var bo = b.end === 'from' ? b.r.to : b.r.from;
      var av = vertical ? ao.cy : ao.cx;
      var bv = vertical ? bo.cy : bo.cx;
      return (av - bv) || (a.r.edge.index - b.r.edge.index);
    });
    var n = list.length;
    /* 端口均匀铺满整条边。
       这里以前还算了 portMargin 与 maxPortGap，但 (i+1)/(n+1) 立刻把余量覆盖掉了；
       而 maxPortGap 那个分支的判据 gapT*n > 1 恒不成立（gapT <= 1/(n+1) < 1/n）。
       两段都是死代码，已删。实测 44px 的边上 4 个端口铺开是 8.8px 间距，
       缩进 12px 后反而只剩 4px、更密 —— 铺满就是这里的正确策略。 */
    list.forEach(function (item, i) {
      item.t = n === 1 ? 0.5 : (i + 1) / (n + 1);
    });
  });

  edges.forEach(function (r) {
    var fromItem = (groups[key(r.from.id, r.fromSide)] || []).filter(function (x) { return x.r === r && x.end === 'from'; })[0];
    var toItem = (groups[key(r.to.id, r.toSide)] || []).filter(function (x) { return x.r === r && x.end === 'to'; })[0];
    r.fromT = fromItem ? fromItem.t : 0.5;
    r.toT = toItem ? toItem.t : 0.5;
  });
  return edges;
}

/* ── 候选与约束 ───────────────────────────────────────── */

function candidates(p0, aSide, p1, bSide, ctx) {
  var s = ROUTE.stub;
  var d0 = dirOf(aSide), d1 = dirOf(bSide);
  var s0 = [p0[0] + d0[0] * s, p0[1] + d0[1] * s];
  var s1 = [p1[0] + d1[0] * s, p1[1] + d1[1] * s];
  var out = [];

  /* 端口错位小于最小段长：合并到中线，避免出现碎段被全部候选拒绝 */
  if (isVerticalSide(aSide) && isVerticalSide(bSide) && Math.abs(p0[1] - p1[1]) < ROUTE.minSeg) {
    var midY = (p0[1] + p1[1]) / 2;
    out.push([[p0[0], midY], [p1[0], midY]]);
  }
  if (!isVerticalSide(aSide) && !isVerticalSide(bSide) && Math.abs(p0[0] - p1[0]) < ROUTE.minSeg) {
    var midX = (p0[0] + p1[0]) / 2;
    out.push([[midX, p0[1]], [midX, p1[1]]]);
  }

  /* 直连：同一水平/垂直轴且朝向相对 */
  if (Math.abs(p0[1] - p1[1]) < 1e-6 && isVerticalSide(aSide) && isVerticalSide(bSide)) {
    out.push([p0, p1]);
  }
  if (Math.abs(p0[0] - p1[0]) < 1e-6 && !isVerticalSide(aSide) && !isVerticalSide(bSide)) {
    out.push([p0, p1]);
  }

  /* 两条单折 L */
  out.push([p0, s0, [s1[0], s0[1]], s1, p1]);
  out.push([p0, s0, [s0[0], s1[1]], s1, p1]);

  /* 两条双折 Z：中点走 x 或走 y */
  var mx = (s0[0] + s1[0]) / 2, my = (s0[1] + s1[1]) / 2;
  out.push([p0, s0, [mx, s0[1]], [mx, s1[1]], s1, p1]);
  out.push([p0, s0, [s0[0], my], [s1[0], my], s1, p1]);

  /* 两条三折 U：绕到外侧通道 */
  var chX = Math.max(s0[0], s1[0]) + 28, chXl = Math.min(s0[0], s1[0]) - 28;
  var chY = Math.max(s0[1], s1[1]) + 28, chYl = Math.min(s0[1], s1[1]) - 28;
  out.push([p0, s0, [chX, s0[1]], [chX, s1[1]], s1, p1]);
  out.push([p0, s0, [chXl, s0[1]], [chXl, s1[1]], s1, p1]);
  out.push([p0, s0, [s0[0], chY], [s1[0], chY], s1, p1]);
  out.push([p0, s0, [s0[0], chYl], [s1[0], chYl], s1, p1]);

  /* 绕过全部节点的最外侧通道 —— 跨层回边只有走这里才不会穿中间节点。
     通道位置由占用表决定：被占了就再外让一格，让多条回边不会叠在同一条线上。

     出线长度给两档：同层节点的间隙往往只有 28px 左右，
     而 20px 出线 + 8px 间隙余量正好等于 28 —— 竖直段会恰好落在余量边界上被判违规，
     于是「绕上方」这种完全合理的走法反而找不到。16px 出线（= minSeg，不能再短）
     就能让开。两档都放进候选集，由代价函数挑。 */
  if (ctx && ctx.bounds) {
    var b = ctx.bounds;
    [ROUTE.stub, ROUTE.minSeg].forEach(function (st) {
      var t0 = [p0[0] + d0[0] * st, p0[1] + d0[1] * st];
      var t1 = [p1[0] + d1[0] * st, p1[1] + d1[1] * st];
      var oxR = outerOffset(ctx, 'V', t0, t1, b.maxX, 1);
      var oxL = outerOffset(ctx, 'V', t0, t1, b.minX, -1);
      var oyB = outerOffset(ctx, 'H', t0, t1, b.maxY, 1);
      var oyT = outerOffset(ctx, 'H', t0, t1, b.minY, -1);
      out.push([p0, t0, [oxR, t0[1]], [oxR, t1[1]], t1, p1]);
      out.push([p0, t0, [oxL, t0[1]], [oxL, t1[1]], t1, p1]);
      out.push([p0, t0, [t0[0], oyB], [t1[0], oyB], t1, p1]);
      out.push([p0, t0, [t0[0], oyT], [t1[0], oyT], t1, p1]);
    });
  }

  var seen = {};
  return out.map(simplify).filter(function (pts) {
    var k = pts.map(function (p) { return p[0] + ',' + p[1]; }).join(';');
    if (seen[k]) return false;
    seen[k] = true;
    return pts.length >= 2;
  });
}

/* 违反量：0 = 完全合规。分两档 —— 侧向契约是契约问题（压过一切几何违反），
   几何违反按严重度累加并早退（CAP），因为降级兜底只需要一个「谁更不烂」的序。 */
var ASSESS = { side: 1000, node: 100, label: 20, rhythm: 5, cap: 8 };

function assess(pts, ctx) {
  var segs = [];
  for (var i = 0; i + 1 < pts.length; i++) segs.push([pts[i], pts[i + 1]]);

  /* 侧向契约先判：它决定首末段的轴向，比几何违反更根本 */
  var side = 0;
  if (segs.length > 1) {
    var first = segs[0], last = segs[segs.length - 1];
    if (isVerticalSide(ctx.fromSide)) { if (Math.abs(first[0][1] - first[1][1]) > 1e-6) side = 1; }
    else { if (Math.abs(first[0][0] - first[1][0]) > 1e-6) side = 1; }
    if (isVerticalSide(ctx.toSide)) { if (Math.abs(last[0][1] - last[1][1]) > 1e-6) side = 1; }
    else { if (Math.abs(last[0][0] - last[1][0]) > 1e-6) side = 1; }
  }

  var bad = 0;
  for (var j = 0; j < segs.length; j++) {
    var len = segLen(segs[j][0], segs[j][1]);
    if (len < 1e-6) return ASSESS.side * side + ASSESS.cap;
    /* 节奏：任何一段不得短于 microSeg；多段路径里任何一段不得短于 minSeg
       （= 2 * corner，否则相邻两道圆角会重叠成尖角） */
    if (len < ROUTE.microSeg) bad += ASSESS.rhythm;
    else if (segs.length > 1 && len < ROUTE.minSeg) bad += ASSESS.rhythm;
    if (bad >= ASSESS.cap) return ASSESS.side * side + ASSESS.cap;

    for (var n = 0; n < ctx.nodeRects.length; n++) {
      var rect = ctx.nodeRects[n];
      if (rect === ctx.fromBox || rect === ctx.toBox) continue;
      if (segHitsRect(segs[j][0], segs[j][1], rect, ROUTE.nodeClear)) {
        bad += ASSESS.node;
        if (bad >= ASSESS.cap) return ASSESS.side * side + ASSESS.cap;
      }
    }
    for (var L = 0; L < ctx.labelRects.length; L++) {
      if (segHitsRect(segs[j][0], segs[j][1], ctx.labelRects[L], ROUTE.labelClear)) {
        bad += ASSESS.label;
        if (bad >= ASSESS.cap) return ASSESS.side * side + ASSESS.cap;
      }
    }
  }
  return ASSESS.side * side + bad;
}

function accept(pts, ctx) { return assess(pts, ctx) === 0; }

/** 几何底价：拐弯 + 路程。与「好不好看」无关，只用来给候选定一个可比的价格。 */
function baseCost(pts) {
  var turns = Math.max(0, pts.length - 2);
  var len = 0;
  for (var i = 0; i + 1 < pts.length; i++) len += segLen(pts[i], pts[i + 1]);
  return turns * 100 + len;
}

/** 候选选择：先用几何底价定一个窗口，只在窗口内比交叉与通道共用。
    窗口（detourBudget）是关键 —— 没有它，交叉权重会把一条边赶到绕全场的外圈通道上，
    为躲一次交叉多走几百像素。窗口内交叉绝对优先；窗口外宁可接受交叉。 */
function selectRoute(cands, ctx) {
  var n = cands.length, best = Infinity, i;
  var base = new Array(n);
  for (i = 0; i < n; i++) { base[i] = baseCost(cands[i]); if (base[i] < best) best = base[i]; }

  var pick = 0, pickScore = Infinity;
  for (i = 0; i < n; i++) {
    if (base[i] > best + ROUTE.detourBudget) continue;      // 绕太远，不参与
    var cross = ctx.cross ? ctx.cross.count(cands[i]) : 0;
    var share = ctx.occ ? Math.min(occOverlap(ctx.occ, cands[i]) * ROUTE.shareW, ROUTE.shareCap) : 0;
    var s = cross * ROUTE.crossW + share + base[i];
    if (s < pickScore) { pickScore = s; pick = i; }         // 严格小于 → 先到者胜
  }
  return { pts: cands[pick], base: base[pick] };
}

/* ── 标签放置 ─────────────────────────────────────────── */

function labelAnchors(pts) {
  var out = [];
  var segs = [];
  for (var i = 0; i + 1 < pts.length; i++) {
    segs.push({ a: pts[i], b: pts[i + 1], len: segLen(pts[i], pts[i + 1]) });
  }
  segs.sort(function (x, y) { return y.len - x.len; });
  segs.forEach(function (s) {
    var mid = [(s.a[0] + s.b[0]) / 2, (s.a[1] + s.b[1]) / 2];
    out.push(mid);
    out.push([s.a[0] + (s.b[0] - s.a[0]) / 3, s.a[1] + (s.b[1] - s.a[1]) / 3]);
    out.push([s.a[0] + (s.b[0] - s.a[0]) * 2 / 3, s.a[1] + (s.b[1] - s.a[1]) * 2 / 3]);
  });
  /* 每个锚点再给几档法向偏移，躲开正好压在上面的边与节点。
     档距必须能跨过节点高度的一半（节点高约 44px，半高 22px）——
     只给 ±14 的话，夹在两个相邻节点之间的小间隙里永远挑不到落点，
     标签必然降级成遮挡态。这些是「追加」的：前面已能找到落点的标签不受影响。 */
  var extra = [];
  [14, 26, 38].forEach(function (d) {
    out.forEach(function (p) {
      extra.push([p[0], p[1] - d]);
      extra.push([p[0], p[1] + d]);
    });
  });
  return out.concat(extra);
}

function placeLabel(pts, text, ctx) {
  if (!text) return null;
  var size = 11;
  var w = measure.width(text, size) + 8;
  var h = size * 1.4 + 4;
  var anchors = labelAnchors(pts);
  for (var i = 0; i < anchors.length; i++) {
    var c = anchors[i];
    var rect = { x: c[0] - w / 2, y: c[1] - h / 2, w: w, h: h };
    var clash = false;
    for (var n = 0; n < ctx.nodeRects.length && !clash; n++) {
      var r = ctx.nodeRects[n];
      if (rect.x < r.x + r.w && r.x < rect.x + rect.w && rect.y < r.y + r.h && r.y < rect.y + rect.h) clash = true;
    }
    for (var L = 0; L < ctx.labelRects.length && !clash; L++) {
      var lr = ctx.labelRects[L];
      if (rect.x < lr.x + lr.w && lr.x < rect.x + rect.w && rect.y < lr.y + lr.h && lr.y < rect.y + rect.h) clash = true;
    }
    if (!clash) return { x: r1(c[0]), y: r1(c[1]), w: Math.ceil(w), h: Math.ceil(h), text: text };
  }
  /* 兜底：最长段中点 + 背景遮罩（渲染时给 label 加 mask） */
  var fallback = anchors[0] || [pts[0][0], pts[0][1]];
  return { x: r1(fallback[0]), y: r1(fallback[1]), w: Math.ceil(w), h: Math.ceil(h), text: text, masked: true };
}

/* ── 主流程 ───────────────────────────────────────────── */

/** 给场景补齐所有边的路由点、标签与最终 viewBox */
route.attach = function (scene, m) {
  var nodeRects = scene.nodes.map(function (n) {
    return { x: n.x, y: n.y, w: n.w, h: n.h, id: n.id };
  });
  var byId = {};
  nodeRects.forEach(function (r) { byId[r.id] = r; });

  var bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
  nodeRects.forEach(function (r) {
    bounds.minX = Math.min(bounds.minX, r.x); bounds.minY = Math.min(bounds.minY, r.y);
    bounds.maxX = Math.max(bounds.maxX, r.x + r.w); bounds.maxY = Math.max(bounds.maxY, r.y + r.h);
  });
  if (!isFinite(bounds.minX)) { bounds = { minX: 0, minY: 0, maxX: 320, maxY: 200 }; }

  /* 只路由两端都在场景里的边；reversed 的边按原方向画。
     slot 记住作者给的边序 —— 路由按确定性顺序走，但结果按 slot 写回。 */
  var work = [];
  m.edges.forEach(function (e) {
    var from = scene.byId[e.from], to = scene.byId[e.to];
    if (!from || !to || e.from === e.to) return;
    work.push({ edge: e, from: from, to: to, fromBox: byId[from.id], toBox: byId[to.id], slot: work.length });
  });
  assignPorts(scene, work);

  var labelRects = [];
  var degraded = 0;
  var outEdges = new Array(work.length);

  /* 确定性路由顺序 + 已放置边的交叉索引 + 通道占用表。
     三者都只在 route.attach 内部活着，不进入 scene。 */
  var order = routeOrder(work);
  var cross = crossIndex(ROUTE.crossCell);
  var occ = {};

  order.forEach(function (r) {
    var p0 = anchorAt(r.fromBox, r.fromSide, r.fromT);
    var p1 = anchorAt(r.toBox, r.toSide, r.toT);
    var ctx = {
      nodeRects: nodeRects, labelRects: labelRects, bounds: bounds,
      fromBox: r.fromBox, toBox: r.toBox,
      fromSide: r.fromSide, toSide: r.toSide,
      cross: cross, occ: occ
    };

    var cands = candidates(p0, r.fromSide, p1, r.toSide, ctx);
    var scored = cands.map(function (pts) { return { pts: pts, bad: assess(pts, ctx) }; });
    var ok = scored.filter(function (s) { return s.bad === 0; })
                   .map(function (s) { return s.pts; });

    var chosen, degradedThis = false;
    if (ok.length) {
      chosen = selectRoute(ok, ctx).pts;
    } else {
      /* 无候选可接受：取违反量最小的，再按几何底价 —— 如实计数，这是路由器承认失败。
         以前这里按 score 取「最短的」，那对节点与标签违反完全瞎，会选出一条穿节点的路径。 */
      scored.sort(function (a, b) { return (a.bad - b.bad) || (baseCost(a.pts) - baseCost(b.pts)); });
      chosen = (scored[0] && scored[0].pts) || [p0, p1];
      degradedThis = true;
      degraded++;
    }

    /* 放置之后才写索引与占用表 —— 索引里的永远是「已放置」的边 */
    cross.add(chosen);
    occAdd(occ, chosen);

    var label = placeLabel(chosen, r.edge.label, ctx);
    if (label) labelRects.push({ x: label.x - label.w / 2, y: label.y - label.h / 2, w: label.w, h: label.h });

    /* 按 work 的下标写回，不 push —— 保持 scene.edges 的顺序与作者给的边序一致，
       这样绘制层叠顺序与 assertScene 的遍历顺序都不受路由顺序影响。 */
    outEdges[r.slot] = {
      id: r.edge.id, from: r.edge.from, to: r.edge.to,
      label: r.edge.label, variant: r.edge.variant, kind: r.edge.kind,
      reversed: !!r.edge.reversed,
      fromSide: r.fromSide, toSide: r.toSide,
      points: chosen,
      d: pathData(chosen),
      labelAt: label,
      degraded: degradedThis,
      index: r.edge.index
    };
  });

  scene.edges = outEdges;
  scene.stats.degradedRoutes = degraded;
  scene.stats.labelCount = labelRects.length;
  /* 最终路由之间的实质交叉数。与 stats.crossings（分层交叉）是两个量，别混。 */
  scene.stats.routeCrossings = routeCrossings(outEdges);
  scene.stats.maskedLabels = outEdges.filter(function (e) {
    return e.labelAt && e.labelAt.masked;
  }).length;

  /* 标签可能伸到框外，把它们并进 viewBox */
  expandForLabels(scene, labelRects);
  return scene;
};

/** 标签与绕外圈的路由点越界时把 viewBox 撑大（重新平移所有内容） */
function expandForLabels(scene, labelRects) {
  var minX = 0, minY = 0, maxX = scene.width, maxY = scene.height;
  labelRects.forEach(function (r) {
    minX = Math.min(minX, r.x - 4); minY = Math.min(minY, r.y - 4);
    maxX = Math.max(maxX, r.x + r.w + 4); maxY = Math.max(maxY, r.y + r.h + 4);
  });
  /* 回边会绕到节点包围盒之外，那些点也必须并进来，否则被裁掉 */
  scene.edges.forEach(function (e) {
    (e.points || []).forEach(function (pt) {
      minX = Math.min(minX, pt[0] - 6); minY = Math.min(minY, pt[1] - 6);
      maxX = Math.max(maxX, pt[0] + 6); maxY = Math.max(maxY, pt[1] + 6);
    });
  });
  if (minX >= 0 && minY >= 0 && maxX <= scene.width && maxY <= scene.height) return;

  var dx = minX < 0 ? -minX : 0, dy = minY < 0 ? -minY : 0;
  scene.nodes.forEach(function (n) {
    n.x = r1(n.x + dx); n.y = r1(n.y + dy);
    n.cx = r1(n.cx + dx); n.cy = r1(n.cy + dy);
  });
  scene.groups.forEach(function (g) { g.x = r1(g.x + dx); g.y = r1(g.y + dy); });
  scene.edges.forEach(function (e) {
    e.points = e.points.map(function (p) { return [r1(p[0] + dx), r1(p[1] + dy)]; });
    e.d = pathData(e.points);
    if (e.labelAt) { e.labelAt.x = r1(e.labelAt.x + dx); e.labelAt.y = r1(e.labelAt.y + dy); }
  });
  scene.width = Math.ceil(maxX + dx);
  scene.height = Math.ceil(maxY + dy);
}

/** 折线转 SVG path；圆角用二次贝塞尔，半径夹到相邻段一半 */
function pathData(pts, radius) {
  var r = radius == null ? ROUTE.corner : radius;
  if (!pts || pts.length < 2) return '';
  if (pts.length === 2 || r <= 0) {
    return pts.map(function (p, i) { return (i ? 'L' : 'M') + r1(p[0]) + ' ' + r1(p[1]); }).join(' ');
  }
  var d = 'M' + r1(pts[0][0]) + ' ' + r1(pts[0][1]);
  for (var i = 1; i < pts.length - 1; i++) {
    var prev = pts[i - 1], cur = pts[i], next = pts[i + 1];
    var l1 = segLen(prev, cur), l2 = segLen(cur, next);
    var rr = Math.min(r, l1 / 2, l2 / 2);
    if (rr < 1) { d += ' L' + r1(cur[0]) + ' ' + r1(cur[1]); continue; }
    var a = [cur[0] + (prev[0] - cur[0]) / l1 * rr, cur[1] + (prev[1] - cur[1]) / l1 * rr];
    var b = [cur[0] + (next[0] - cur[0]) / l2 * rr, cur[1] + (next[1] - cur[1]) / l2 * rr];
    d += ' L' + r1(a[0]) + ' ' + r1(a[1]) +
         ' Q' + r1(cur[0]) + ' ' + r1(cur[1]) + ' ' + r1(b[0]) + ' ' + r1(b[1]);
  }
  var last = pts[pts.length - 1];
  return d + ' L' + r1(last[0]) + ' ' + r1(last[1]);
}

/** 折线转 SVG path（渲染器直接用） */
route.pathData = pathData;

/** 箭头方向：末段的朝向 */
route.arrowAngle = function (pts) {
  if (!pts || pts.length < 2) return 0;
  var a = pts[pts.length - 2], b = pts[pts.length - 1];
  var dx = b[0] - a[0], dy = b[1] - a[1];
  if (Math.abs(dx) < 1e-6 && Math.abs(dy) < 1e-6) return 0;
  return Math.atan2(dy, dx) * 180 / Math.PI;
};

/* ── 几何断言（check.mjs 在 Node 里复用同一份逻辑） ───── */

route.assertScene = function (scene) {
  var problems = [];
  var nodes = scene.nodes;
  for (var i = 0; i < nodes.length; i++) {
    for (var j = i + 1; j < nodes.length; j++) {
      var a = nodes[i], b = nodes[j];
