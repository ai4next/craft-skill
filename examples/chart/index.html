      if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) {
        problems.push({ code: 'layout/no-overlap', subject: a.id + ' × ' + b.id });
      }
    }
  }
  nodes.forEach(function (n) {
    if (n.x < -0.5 || n.y < -0.5 || n.x + n.w > scene.width + 0.5 || n.y + n.h > scene.height + 0.5) {
      problems.push({ code: 'layout/in-viewbox', subject: n.id });
    }
  });
  scene.edges.forEach(function (e) {
    for (var k = 0; k + 1 < e.points.length; k++) {
      var p = e.points[k], q = e.points[k + 1];
      for (var n = 0; n < nodes.length; n++) {
        if (nodes[n].id === e.from || nodes[n].id === e.to) continue;
        if (segHitsRect(p, q, nodes[n], 0)) {
          problems.push({ code: 'layout/no-edge-through-node', subject: e.id + ' → ' + nodes[n].id });
        }
      }
    }
  });
  /* masked 标签是 placeLabel 找不到无冲突锚点时的兜底，它必然压着别的东西。
     以前这里用 !e.labelAt.masked 把它们整个滤掉 —— 等于对最明显的排版缺陷视而不见。 */
  var labels = scene.edges.filter(function (e) { return e.labelAt; });
  var unmasked = [];
  labels.forEach(function (e) {
    if (e.labelAt.masked) {
      problems.push({ code: 'layout/label-masked', subject: e.id + '（"' + (e.label || '') + '"）' });
    } else {
      unmasked.push(e);
    }
  });
  for (var m = 0; m < unmasked.length; m++) {
    for (var n2 = m + 1; n2 < unmasked.length; n2++) {
      var la = unmasked[m].labelAt, lb = unmasked[n2].labelAt;
      if (Math.abs(la.x - lb.x) * 2 < la.w + lb.w && Math.abs(la.y - lb.y) * 2 < la.h + lb.h) {
        problems.push({ code: 'layout/no-label-collision', subject: unmasked[m].id + ' × ' + unmasked[n2].id });
      }
    }
  }

  /* 路由节奏：微段与过短的内部折角。路由器在 accept 阶段已经拒绝这类候选，
     所以这条只可能在降级兜底路径上触发 —— 它是「路由器失守」的旁证，不是常规噪音。 */
  var rhythm = [];
  scene.edges.forEach(function (e) {
    for (var k = 0; k + 1 < e.points.length; k++) {
      var len = segLen(e.points[k], e.points[k + 1]);
      if (len < ROUTE.microSeg) { rhythm.push(e.id + ' 有 ' + r1(len) + 'px 微段'); break; }
      if (e.points.length > 2 && len < ROUTE.minSeg) { rhythm.push(e.id + ' 有 ' + r1(len) + 'px 短段'); break; }
    }
  });
  if (rhythm.length) {
    problems.push({
      code: 'layout/route-rhythm', severity: 'warning',
      subject: rhythm.slice(0, 4).join('；'),
      message: rhythm.length + ' 条边有微段或过短的折角，拐角会糊在一起',
      fixes: ['减少跨层连接', '缩短标签', '给节点加分组让它们靠近']
    });
  }

  /* 通道共用：两条无关边在同一条线上共线重叠 —— 视觉上会糊成一条更粗的线。
     与「交叉」是两类不同的缺陷，所以分开报。 */
  var corridor = [];
  var occ = {};
  scene.edges.forEach(function (e, idx) {
    for (var k = 0; k + 1 < e.points.length; k++) {
      var p = e.points[k], q = e.points[k + 1];
      var vert = Math.abs(p[0] - q[0]) < 1e-6;
      if (!vert && Math.abs(p[1] - q[1]) >= 1e-6) continue;
      var key = occKey(vert ? 'V' : 'H', vert ? p[0] : p[1]);
      var lo = Math.min(vert ? p[1] : p[0], vert ? q[1] : q[0]);
      var hi = Math.max(vert ? p[1] : p[0], vert ? q[1] : q[0]);
      (occ[key] || (occ[key] = [])).forEach(function (prev) {
        if (prev.idx === idx) return;
        var ov = Math.min(hi, prev.hi) - Math.max(lo, prev.lo);
        if (ov >= 8) corridor.push(e.id + ' 与 ' + prev.id + ' 共线 ' + r1(ov) + 'px');
      });
      occ[key].push({ idx: idx, id: e.id, lo: lo, hi: hi });
    }
  });
  if (corridor.length) {
    problems.push({
      code: 'layout/corridor-shared', severity: 'warning',
      subject: corridor.slice(0, 4).join('；'),
      message: corridor.length + ' 处边在同一条通道上共线重叠，会糊成一条线',
      fixes: ['减少同向的平行边', '给节点加分组让它们靠近', '调整 nodes[].order（仅 architecture）']
    });
  }

  return problems;
};

/* ── mountSurface ─────────────────────────────────────── */

/* chart 与 diagram 共用的外壳：容器解析、SVG 建立、命名图层、resize 与主题
   重绘、rAF 合并、销毁。各自的内容绘制通过 opts.draw 注入。
   抽出来是为了让两种表面行为一致 —— 少一处主题监听就会漏掉一次重绘。 */

var surfaces = [];

Craft.mountSurface = function (target, opts) {
  opts = opts || {};
  var root = typeof target === 'string' ? util.qs(target) : target;
  if (!root) throw new Error((opts.who || 'Craft.mountSurface') + ': 找不到容器 ' + target);

  root.classList.add(opts.className || 'craft-surface');
  if (opts.minHeight) root.style.setProperty('min-height', opts.minHeight + 'px');

  var svg = util.svgEl('svg', {
    role: opts.role || 'img',
    'aria-label': opts.ariaLabel || '图示',
    preserveAspectRatio: opts.preserveAspectRatio || 'xMidYMid meet'
  });
  root.appendChild(svg);

  var surface = {
    root: root,
    svg: svg,
    outerWidth: 0,
    width: 0,
    height: 0,
    destroyed: false,
    layers: {},
    draw: opts.draw || function () {},
    beforeDraw: opts.beforeDraw || function () {}
  };

  (opts.layers || []).forEach(function (name) {
    var g = util.svgEl('g', { 'class': 'craft-layer craft-layer-' + name });
    svg.appendChild(g);
    surface.layers[name] = g;
  });

  surface.setViewBox = function (w, h) {
    surface.width = w;
    surface.height = h;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  };

  surface.measure = function () {
    surface.outerWidth = root.clientWidth || opts.fallbackWidth || 640;
  };

  surface.redraw = util.raf(function () {
    if (surface.destroyed) return;
    surface.measure();
    surface.beforeDraw(surface);
    surface.draw(surface);
  });

  surface.destroy = function () {
    surface.destroyed = true;
    if (surface.ro) surface.ro.disconnect();
    if (surface.untheme) surface.untheme();
    if (root) root.innerHTML = '';
    var i = surfaces.indexOf(surface);
    if (i >= 0) surfaces.splice(i, 1);
  };

  /* resize 与主题重绘由 surface 拥有 —— 作者不要重复监听 */
  if (window.ResizeObserver) {
    surface.ro = new ResizeObserver(surface.redraw);
    surface.ro.observe(root);
  } else {
    util.on(window, 'resize', util.debounce(surface.redraw, 120));
  }
  surface.untheme = theme.onChange(surface.redraw);

  surfaces.push(surface);
  return surface;
};

Craft.mountSurface.all = function () { return surfaces.slice(); };

var chartRenderers = {};

var chart = Craft.chart = {
  /**
   * 注册自定义图表。作者在解析期调用即可 —— boot 挂载时会取到，
   * 不用和自动挂载抢时序（抢不过：boot 总是先跑）。
   *   Craft.chart.define('valueFn', { data: [...], render: function (ctx) {...} });
   * 然后 <div data-craft-chart="x" data-craft-chart-type="custom"
   *          data-craft-chart-render="valueFn"></div>
   */
  define: function (name, def) {
    chartRenderers[name] = def || {};
    return chart;
  },
  renderers: function () { return chartRenderers; },

  mount: function (target, cfg) {
    cfg = cfg || {};

    var xCfg = typeof cfg.x === 'string' ? { field: cfg.x } : (cfg.x || {});
    var yCfg = typeof cfg.y === 'string' ? { field: cfg.y } : (cfg.y || {});
    var rows = rowsOf(cfg.data != null ? cfg.data : Craft.data.get(cfg.dataKey));
    if (!rows.length) {
      console.warn('[craft] 图表 ' + (cfg.id || '') + ' 没有数据');
      /* 没数据就别画 —— 一个空的坐标系比不画更误导 */
      return { id: cfg.id, cfg: cfg, rows: [], empty: true, redraw: function () {}, update: function () {}, destroy: function () {} };
    }

    var margin = Object.assign({ t: 16, r: 20, b: 54, l: 64 }, cfg.margin || {});
    var height = cfg.height || 360;
    var kind = cfg.type || 'line';

    var instance = {
      cfg: cfg, rows: rows, kind: kind,
      xCfg: xCfg, yCfg: yCfg, margin: margin, height: height,
      width: 0, outerWidth: 0, innerHeight: 0
    };

    var surface = Craft.mountSurface(target, {
      who: 'Craft.chart.mount',
      className: 'craft-chart',
      minHeight: cfg.height ? height : 0,
      ariaLabel: cfg.ariaLabel || cfg.title || '数据图表',
      layers: ['grid', 'marks', 'axes'],
      fallbackWidth: 640,
      beforeDraw: function (s) {
        /* viewBox 决定坐标系与自适应比例；没有它 SVG 会塌成默认 150px 高，
           绘图内容会溢出到下方的图注与图例上。 */
        s.setViewBox(s.outerWidth, height);
        instance.outerWidth = s.outerWidth;
        instance.width = Math.max(240, s.outerWidth - margin.l - margin.r);
        instance.innerHeight = Math.max(120, height - margin.t - margin.b);
      },
      draw: function () { instance.paint(); }
    });

    instance.surface = surface;
    instance.root = surface.root;
    instance.svg = surface.svg;
    instance.gGrid = surface.layers.grid;
    instance.gMarks = surface.layers.marks;
    instance.gAxes = surface.layers.axes;

    if (cfg.title) {
      var cap = util.el('div', { 'class': 'craft-caption' }, [
        util.el('strong', { text: cfg.title }),
        cfg.caption ? ' — ' + cfg.caption : ''
      ]);
      surface.root.appendChild(cap);
      instance.caption = cap;
    }

    var legendEl = util.el('div', { 'class': 'craft-legend' });
    surface.root.appendChild(legendEl);
    instance.legendEl = legendEl;

    /* a11y：视觉隐藏的数据表，屏幕阅读器可读全部数值 */
    if (cfg.table !== 'none') {
      var tableWrap = util.el('div', { 'class': 'craft-sr-only' });
      surface.root.appendChild(tableWrap);
      instance.tableWrap = tableWrap;
    }

    instance.buildScales = function () {
      var xs = xCfg.type || inferType(rows, xCfg.field);
      var ys = yCfg.type || inferType(rows, yCfg.field);
      xCfg.type = xs; yCfg.type = ys;
      var xRange = [0, instance.width];
      var yRange = [instance.innerHeight, 0];

      var xDom = instance.xDomainOverride || extent(rows, xCfg.field);
      /* 柱状图在连续轴上也要占宽度：把 domain 两端各撑开半个柱宽，
         否则首尾柱子会越出绘图区、压住 Y 轴标签。 */
      if (!instance.xDomainOverride && (kind === 'bar' || kind === 'stacked-bar') && xs !== 'band') {
        var n = distinct(rows, xCfg.field).length;
        var half = n > 1 ? (xDom[1] - xDom[0]) / (n - 1) / 2 : 86400000;
        xDom = [xDom[0] - half, xDom[1] + half];
      }

      instance.x = xs === 'band'
        ? scale.band({ domain: distinct(rows, xCfg.field), range: xRange, padding: 0.2 })
        : scale.auto(xs, {
            domain: xDom,
            range: xRange, nice: xs !== 'time', ticks: 6, pattern: xCfg.format
          });

      var yDom = extent(rows, yCfg.field);
      if (yCfg.zero !== false && ys === 'linear') yDom[0] = Math.min(0, yDom[0]);
      instance.y = scale.auto(ys, { domain: yDom, range: yRange, nice: ys !== 'time', ticks: 5 });

      var keys = seriesOf(rows, cfg);
      instance.seriesKeys = keys;
      instance.hasSeries = keys[0] !== null;
      var colorMode = (cfg.series && cfg.series.color) || (cfg.color) || 'categorical';
      instance.colorFor = function (k) {
        if (!instance.hasSeries) return color.categorical(0);
        if (colorMode === 'sequential') return color.sequential(keys.indexOf(k) / Math.max(1, keys.length - 1));
        if (colorMode === 'diverging') return color.diverging(keys.indexOf(k) / Math.max(1, keys.length - 1));
        return color.categorical(keys.indexOf(k));
      };
    };

    /* 柱宽：band 轴直接用 bandwidth；连续轴（时间/线性）用相邻刻度点的
       最小像素间距推算 —— 否则柱子会细成发丝。 */
    instance.step = function () {
      if (instance.x && instance.x.bandwidth) return instance.x.bandwidth();
      var px = distinct(rows, xCfg.field).map(function (v) { return instance.x(v); })
        .filter(function (v) { return isFinite(v); })
        .sort(function (a, b) { return a - b; });
      if (px.length < 2) return 24;
      var min = Infinity;
      for (var i = 1; i < px.length; i++) min = Math.min(min, px[i] - px[i - 1]);
      return isFinite(min) && min > 0 ? min : 24;
    };

    instance.makeCtx = function () {
      var ctx = {
        g: instance.gMarks,
        svg: instance.svg,
        root: instance.root,
        chart: instance,
        data: rows,
        seriesKeys: instance.seriesKeys,
        hasSeries: instance.hasSeries,
        width: instance.width,
        height: instance.innerHeight,
        outerWidth: instance.outerWidth,
        step: instance.step,
        margin: margin,
        x: instance.x,
        y: instance.y,
        color: instance.colorFor,
        xField: xCfg.field,
        yField: yCfg.field,
        seriesField: cfg.series && cfg.series.field,
        fmt: fmt,
        colorScale: color,
        Craft: Craft,
        dataFor: function (k) {
          return rows.filter(function (d) { return String(d[cfg.series.field]) === k; });
        },
        join: function (selector, data, keyFn) {
          return makeJoin(instance.gMarks, selector, data || rows, keyFn);
        }
      };
      return ctx;
    };

    instance.drawAxes = function () {
      while (instance.gAxes.firstChild) instance.gAxes.removeChild(instance.gAxes.firstChild);
      while (instance.gGrid.firstChild) instance.gGrid.removeChild(instance.gGrid.firstChild);
      instance.gAxes.setAttribute('transform', 'translate(' + margin.l + ',' + margin.t + ')');
      instance.gGrid.setAttribute('transform', 'translate(' + margin.l + ',' + margin.t + ')');
      var gridOn = yCfg.grid !== false;
      axis.render(instance.gAxes, instance.y, {
        orient: 'left', ticks: 5,
        label: yCfg.label,
        format: yCfg.format ? fmt.auto(yCfg.type === 'time' ? 'time' : 'linear', yCfg.format) : null
      });
      if (gridOn) {
        axis.render(instance.gGrid, instance.y, {
          orient: 'left', ticks: 5, grid: true, gridSpan: instance.width
        });
      }
      /* 轴组在绘图区左上角，bottom 轴要再往下平移一个绘图区高度才落在底边 */
      var xAxisG = util.svgEl('g', { transform: 'translate(0,' + instance.innerHeight + ')' });
      instance.gAxes.appendChild(xAxisG);
      axis.render(xAxisG, instance.x, {
        orient: 'bottom', ticks: xCfg.type === 'band' ? undefined : 6,
        label: xCfg.label,
        format: fmt.auto(xCfg.type, xCfg.format)
      });
    };

    instance.drawLegend = function () {
      legendEl.innerHTML = '';
      if (cfg.legend === 'none' || !instance.hasSeries || instance.seriesKeys.length < 2) return;
      instance.seriesKeys.forEach(function (k, i) {
        legendEl.appendChild(util.el('span', { 'class': 'craft-legend-item' }, [
          util.el('span', {
            'class': 'craft-legend-swatch',
            'data-pattern': color.pattern(i),
            style: { background: instance.colorFor(k) }
          }),
          util.el('span', { text: k })
        ]));
      });
    };

    instance.drawTable = function () {
      if (!instance.tableWrap) return;
      instance.tableWrap.innerHTML = '';
      var cols = [xCfg.field, yCfg.field];
      if (cfg.series && cfg.series.field) cols.unshift(cfg.series.field);
      var t = util.el('table');
      var thead = util.el('thead');
      var tr = util.el('tr');
      cols.forEach(function (c) { tr.appendChild(util.el('th', { text: c, scope: 'col' })); });
      thead.appendChild(tr);
      t.appendChild(thead);
      var tb = util.el('tbody');
      rows.slice(0, 200).forEach(function (d) {
        var r = util.el('tr');
        cols.forEach(function (c) {
          var v = d[c];
          r.appendChild(util.el('td', {
            text: xCfg.type === 'time' && c === xCfg.field ? fmt.date(v) : String(v == null ? '' : v)
          }));
        });
        tb.appendChild(r);
      });
      t.appendChild(tb);
      instance.tableWrap.appendChild(t);
      var id = 'craft-table-' + (++uid);
      t.id = id;
      instance.svg.setAttribute('aria-describedby', id);
      t.setAttribute('aria-label', (cfg.title || '数据') + ' 数据表');
    };

    instance.render = function () {
      var ctx = instance.makeCtx();
      var renderFn = cfg.render;
      if (!renderFn && kind !== 'custom') {
        renderFn = (Craft.marks && Craft.marks[camel(kind)]) || null;
      }
      if (!renderFn) {
        console.warn('[craft] 图表类型 "' + kind + '" 没有渲染器，且未提供 render(ctx)');
        return;
      }
      renderFn(ctx);
      tooltip.attach(instance.gMarks, function (d) {
        return cfg.tooltip ? cfg.tooltip(d, instance) : defaultTip(d, { x: xCfg, y: yCfg, series: cfg.series }, instance);
      });
    };

    /* surface.beforeDraw 已经算好尺寸与 viewBox，这里只管画 */
    instance.paint = function () {
      instance.buildScales();
      /* marks 组平移到绘图原点，作者在 ctx 里拿到的坐标就是绘图区局部坐标 */
      instance.gMarks.setAttribute('transform', 'translate(' + margin.l + ',' + margin.t + ')');
      instance.drawAxes();
      instance.drawLegend();
      instance.drawTable();
      instance.render();
    };

    instance.redraw = function () { surface.redraw(); };

    instance.update = function (newData) {
      if (newData) { rows = instance.rows = rowsOf(newData); }
      instance.redraw();
      return instance;
    };

    instance.destroy = function () {
      surface.destroy();
      var i = charts.indexOf(instance);
      if (i >= 0) charts.splice(i, 1);
    };

    charts.push(instance);
    instance.redraw();
    return instance;
  },
  all: function () { return charts.slice(); },
  redrawAll: function () { charts.forEach(function (c) { c.redraw(); }); }
};

function distinct(rows, field) {
  var seen = {}, out = [];
  rows.forEach(function (d) {
    var v = d ? d[field] : null;
    if (v == null) return;
    var k = String(v);
    if (!seen[k]) { seen[k] = true; out.push(v); }
  });
  return out;
}

function camel(s) {
  return String(s).replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); });
}

/* ── marks ────────────────────────────────────────────── */

function sortByX(rows, field, type) {
  return rows.slice().sort(function (a, b) {
    var av = type === 'time' ? toTime(a[field]) : util.num(a[field]);
    var bv = type === 'time' ? toTime(b[field]) : util.num(b[field]);
    return av - bv;
  });
}

function markLabel(ctx, d) {
  var xv = d[ctx.xField];
  var xs = ctx.chart.xCfg.type === 'time' ? fmt.date(xv, ctx.chart.xCfg.format) : String(xv);
  var yv = ctx.yField ? fmt.number(d[ctx.yField], { digits: 1 }) : '';
  var sv = ctx.seriesField ? String(d[ctx.seriesField]) + ' ' : '';
  return sv + xs + '：' + yv;
}

var marks = Craft.marks = {
  line: function (ctx) {
    var keys = ctx.hasSeries ? ctx.seriesKeys : [null];
    var sel = ctx.join('path.craft-line', keys, function (k) { return k == null ? '__all' : k; });
    sel.enter.append('path', {
      'class': 'craft-line', fill: 'none', 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round'
    });
    sel.update
      .attr('d', function (k) {
        var rows = sortByX(k == null ? ctx.data : ctx.dataFor(k), ctx.xField, ctx.chart.xCfg.type);
        return rows.map(function (d, i) {
          return (i ? 'L' : 'M') + r1(ctx.x(d[ctx.xField])) + ' ' + r1(ctx.y(d[ctx.yField]));
        }).join(' ');
      })
      .attr('stroke', function (k) { return ctx.color(k); });
    sel.exit.remove();

    /* 数据点：悬停与键盘可达的锚点 */
    var pts = ctx.join('circle.craft-point', ctx.data, function (d, i) {
      return (ctx.seriesField ? d[ctx.seriesField] : '') + '|' + d[ctx.xField] + '|' + i;
    });
    pts.enter.append('circle', { 'class': 'craft-point', r: 3.5, 'data-craft-mark': '' });
    pts.update
      .attr('cx', function (d) { return r1(ctx.x(d[ctx.xField])); })
      .attr('cy', function (d) { return r1(ctx.y(d[ctx.yField])); })
      .attr('fill', function (d) { return ctx.color(ctx.seriesField ? d[ctx.seriesField] : null); })
      .attr('data-label', function (d) { return markLabel(ctx, d); });
    pts.exit.remove();
  },

  area: function (ctx) {
    var keys = ctx.hasSeries ? ctx.seriesKeys : [null];
    var sel = ctx.join('path.craft-area', keys, function (k) { return k == null ? '__all' : k; });
    sel.enter.append('path', { 'class': 'craft-area', stroke: 'none' });
    sel.update
      .attr('d', function (k) {
        var rows = sortByX(k == null ? ctx.data : ctx.dataFor(k), ctx.xField, ctx.chart.xCfg.type);
        if (!rows.length) return '';
        var base = ctx.y(Math.min(0, ctx.chart.y.domain()[0]));
        var top = rows.map(function (d, i) {
          return (i ? 'L' : 'M') + r1(ctx.x(d[ctx.xField])) + ' ' + r1(ctx.y(d[ctx.yField]));
        }).join(' ');
        var last = rows[rows.length - 1], first = rows[0];
        return top + 'L' + r1(ctx.x(last[ctx.xField])) + ' ' + r1(base) +
               'L' + r1(ctx.x(first[ctx.xField])) + ' ' + r1(base) + ' Z';
      })
      .attr('fill', function (k) { return ctx.color(k); })
      .attr('fill-opacity', keys.length > 1 ? 0.55 : 0.28);
    sel.exit.remove();
  },

  bar: function (ctx) {
    var keys = ctx.hasSeries ? ctx.seriesKeys : [null];
    var band = ctx.step();
    var gap = keys.length > 1 ? 1 : 2;
    var groupW = Math.max(1, band / Math.max(1, keys.length));
    var isBand = !!ctx.chart.x.bandwidth;
    var sel = ctx.join('rect.craft-bar', ctx.data, function (d, i) {
      return (ctx.seriesField ? d[ctx.seriesField] : '') + '|' + d[ctx.xField] + '|' + i;
    });
    sel.enter.append('rect', { 'class': 'craft-bar', rx: 2, 'data-craft-mark': '' });
    sel.update
      .each(function (d) {
        var off = ctx.seriesField ? keys.indexOf(String(d[ctx.seriesField])) * groupW : 0;
        var left = isBand
          ? ctx.chart.x(d[ctx.xField]) + off
          : ctx.x(d[ctx.xField]) - band / 2 + off;
        var zero = ctx.y(Math.min(0, ctx.chart.y.domain()[0]));
        var top = ctx.y(d[ctx.yField]);
        this.setAttribute('x', r1(left));
        this.setAttribute('width', r1(Math.max(1, groupW - gap)));
        this.setAttribute('y', r1(Math.min(zero, top)));
        this.setAttribute('height', r1(Math.abs(zero - top)));
        this.setAttribute('fill', ctx.color(ctx.seriesField ? d[ctx.seriesField] : null));
        this.setAttribute('data-label', markLabel(ctx, d));
      });
    sel.exit.remove();
  },

  stackedBar: function (ctx) {
    var keys = ctx.hasSeries ? ctx.seriesKeys : [null];
    var band = ctx.step();
    var isBand = !!ctx.chart.x.bandwidth;
    var running = {};
    var rows = ctx.data.slice().sort(function (a, b) {
      return keys.indexOf(String(a[ctx.seriesField])) - keys.indexOf(String(b[ctx.seriesField]));
    });
    var sel = ctx.join('rect.craft-bar', rows, function (d, i) {
      return (ctx.seriesField ? d[ctx.seriesField] : '') + '|' + d[ctx.xField] + '|' + i;
    });
    sel.enter.append('rect', { 'class': 'craft-bar', 'data-craft-mark': '' });
    sel.update
      .each(function (d) {
        var xk = String(d[ctx.xField]);
        var base = running[xk] || 0;
        var v = util.num(d[ctx.yField]) || 0;
        running[xk] = base + v;
        var left = isBand ? ctx.chart.x(d[ctx.xField]) : ctx.x(d[ctx.xField]) - band / 2;
        var yTop = ctx.y(base + v), yBot = ctx.y(base);
        this.setAttribute('x', r1(left));
        this.setAttribute('width', r1(Math.max(1, band - 2)));
        this.setAttribute('y', r1(Math.min(yTop, yBot)));
        this.setAttribute('height', r1(Math.abs(yBot - yTop)));
        this.setAttribute('fill', ctx.color(ctx.seriesField ? d[ctx.seriesField] : null));
        this.setAttribute('data-label', markLabel(ctx, d));
      });
    sel.exit.remove();
  },

  scatter: function (ctx) {
    var sel = ctx.join('circle.craft-point', ctx.data, function (d, i) {
      return (ctx.seriesField ? d[ctx.seriesField] : '') + '|' + d[ctx.xField] + '|' + i;
    });
    sel.enter.append('circle', { 'class': 'craft-point', r: 4, 'data-craft-mark': '' });
    sel.update
      .attr('cx', function (d) { return r1(ctx.x(d[ctx.xField])); })
      .attr('cy', function (d) { return r1(ctx.y(d[ctx.yField])); })
      .attr('fill', function (d) { return ctx.color(ctx.seriesField ? d[ctx.seriesField] : null); })
      .attr('fill-opacity', 0.75)
      .attr('data-label', function (d) { return markLabel(ctx, d); });
    sel.exit.remove();
  },

  heatmap: function (ctx) {
    var yField = ctx.chart.cfg.yCat || ctx.seriesField;
    if (!yField) { console.warn('[craft] heatmap 需要 series.field 或 cfg.yCat 指定纵轴分类'); return; }
    var xs = ctx.chart.x.bandwidth ? ctx.chart.x : null;
    if (!xs) { console.warn('[craft] heatmap 的 x 必须是 band 类型'); return; }
    var yc = scale.band({ domain: distinct(ctx.data, yField), range: [ctx.height, 0], padding: 0.08 });
    var vals = ctx.data.map(function (d) { return util.num(d[ctx.yField]); });
    var cs = color.sequentialScale(vals);
    var sel = ctx.join('rect.craft-cell', ctx.data, function (d, i) {
      return d[ctx.xField] + '|' + d[yField] + '|' + i;
    });
    sel.enter.append('rect', { 'class': 'craft-cell', 'data-craft-mark': '' });
    sel.update
      .attr('x', function (d) { return r1(xs(d[ctx.xField])); })
      .attr('y', function (d) { return r1(yc(d[yField])); })
      .attr('width', function () { return r1(Math.max(1, xs.bandwidth())); })
      .attr('height', function () { return r1(Math.max(1, yc.bandwidth())); })
      .attr('fill', function (d) { return cs(d[ctx.yField]); })
      .attr('data-label', function (d) {
        return String(d[yField]) + ' × ' + String(d[ctx.xField]) + '：' + fmt.number(d[ctx.yField], { digits: 1 });
      });
    sel.exit.remove();

    /* 纵轴分类标签画在绘图区左侧（marks 组已平移到绘图原点） */
    var yLabels = ctx.join('text.craft-heat-label', yc.domain(), function (k) { return String(k); });
    yLabels.enter.append('text', { 'class': 'craft-heat-label' });
    yLabels.update
      .attr('x', -8)
      .attr('y', function (k) { return r1(yc(k) + yc.bandwidth() / 2); })
      .attr('text-anchor', 'end')
      .attr('dominant-baseline', 'middle')
      .attr('fill', theme.token('--craft-muted', '#888'))
      .attr('font-size', '12')
      .text(function (k) { return String(k); });
    yLabels.exit.remove();
  },

  sparkline: function (ctx) {
    var sel = ctx.join('path.craft-line', [null], function () { return '__all'; });
    sel.enter.append('path', { 'class': 'craft-line', fill: 'none', 'stroke-width': 1.5 });
    sel.update
      .attr('d', function () {
        var rows = sortByX(ctx.data, ctx.xField, ctx.chart.xCfg.type);
        return rows.map(function (d, i) {
          return (i ? 'L' : 'M') + r1(ctx.x(d[ctx.xField])) + ' ' + r1(ctx.y(d[ctx.yField]));
        }).join(' ');
      })
      .attr('stroke', function () { return ctx.color(null); });
    sel.exit.remove();
  }
};

function r1(v) { return isFinite(v) ? Math.round(v * 10) / 10 : 0; }

/* ── bind ─────────────────────────────────────────────── */

function coerceControl(el) {
  var tag = el.tagName;
  if (el.type === 'checkbox') return !!el.checked;
  if (el.type === 'radio') return el.checked ? el.value : undefined;
  if (tag === 'SELECT' && el.multiple) {
    return Array.prototype.map.call(el.selectedOptions, function (o) { return o.value; });
  }
  if (el.type === 'range' || el.type === 'number') {
    var n = parseFloat(el.value);
    return isNaN(n) ? 0 : n;
  }
  return el.value;
}

function formatOutput(v, el) {
  var how = el.getAttribute('data-craft-format') || (typeof v === 'number' ? 'number' : 'raw');
  var digits = el.hasAttribute('data-craft-digits')
    ? parseInt(el.getAttribute('data-craft-digits'), 10) : null;
  if (Array.isArray(v)) return v.join('、');
  switch (how) {
    case 'percent': return fmt.percent(v, digits);
    case 'date': return fmt.date(v, el.getAttribute('data-craft-date-format'));
    case 'compact': return fmt.compact(v);
    case 'number': return fmt.number(v, { digits: digits == null ? undefined : digits });
    default: return String(v == null ? '' : v);
  }
}

Craft.bind = function (target, opts) {
  opts = opts || {};
  var root = typeof target === 'string' ? util.qs(target) : target;
  if (!root) throw new Error('Craft.bind: 找不到容器 ' + target);

  var initial = Object.assign({}, opts.state || {});
  var state = Object.assign({}, initial);
  var controls = util.qsa('[data-craft-control]', root);
  var outputs = util.qsa('[data-craft-output]', root);

  /* state 是唯一真相：先把 state 写回 DOM */
  function writeBack() {
    controls.forEach(function (el) {
      var k = el.getAttribute('data-craft-control');
      if (!(k in state)) return;
      var v = state[k];
      if (el.type === 'checkbox') el.checked = !!v;
      else if (el.type === 'radio') el.checked = String(el.value) === String(v);
      else if (el.tagName === 'SELECT' && el.multiple) {
        Array.prototype.forEach.call(el.options, function (o) {
          o.selected = (v || []).indexOf(o.value) >= 0;
        });
      } else el.value = v;
    });
  }

  function syncOutputs() {
    outputs.forEach(function (el) {
      var k = el.getAttribute('data-craft-output');
      if (k in state) el.textContent = formatOutput(state[k], el);
    });
  }

  var notify = util.raf(function (changed) {
    syncOutputs();
    if (opts.onChange) opts.onChange(state, changed);
    util.emit(root, 'craft:change', { state: state, changed: changed });
  });

  function readAndNotify(changedKey) {
    var changed = {};
    controls.forEach(function (el) {
      var k = el.getAttribute('data-craft-control');
      if (!k) return;
      var v = coerceControl(el);
      if (v === undefined) return;
      if (state[k] !== v) { state[k] = v; changed[k] = v; }
    });
    if (changedKey) changed[changedKey] = state[changedKey];
    notify(changed);
  }

  controls.forEach(function (el) {
    var k = el.getAttribute('data-craft-control');
    if (k && !(k in initial)) {
      /* 宽容处理：state 里没声明的键，采纳 DOM 上的初始值 */
      var v = coerceControl(el);
      if (v !== undefined) {
        state[k] = v;
        console.warn('[craft] 控件键 "' + k + '" 未出现在 Craft.bind 的 state 中，已采纳 DOM 初始值');
      }
    }
    var ev = (el.type === 'range' || el.tagName === 'SELECT' || el.type === 'text') ? 'input' : 'change';
    util.on(el, ev, function () { readAndNotify(k); });
    if (el.tagName === 'SELECT') util.on(el, 'change', function () { readAndNotify(k); });
  });

  util.qsa('[data-craft-reset]', root).forEach(function (btn) {
    util.on(btn, 'click', function () {
      state = Object.assign({}, initial);
      writeBack();
      syncOutputs();
      notify(Object.assign({}, state));
    });
  });

  writeBack();
  syncOutputs();

  return {
    state: state,
    root: root,
    get: function (k) { return state[k]; },
    set: function (k, v) { state[k] = v; writeBack(); readAndNotify(k); return state; },
    reset: function () { state = Object.assign({}, initial); writeBack(); syncOutputs(); notify(state); },
    refresh: function () { syncOutputs(); if (opts.onChange) opts.onChange(state, {}); },
    destroy: function () { /* 监听器随容器一起被丢弃 */ }
  };
};

/* ── step（分步叙事） ─────────────────────────────────── */

function scrollToStep(el) {
  if (!el || typeof el.scrollIntoView !== 'function') return;
  el.scrollIntoView({ behavior: motionReduced() ? 'auto' : 'smooth', block: 'center' });
}

Craft.step = function (target, opts) {
  opts = opts || {};
  var root = typeof target === 'string' ? util.qs(target) : target;
  if (!root) throw new Error('Craft.step: 找不到容器 ' + target);
  root.__craftStepped = true;

  var sections = util.qsa('[data-craft-step]', root).sort(function (a, b) {
    return (+a.getAttribute('data-craft-step')) - (+b.getAttribute('data-craft-step'));
  });
  if (!sections.length) return null;

  var current = -1;
  /* rail 通常是 fixed 定位、位于 story 文档流之外，所以不能只在 root 里找。
     优先 root 内，其次取文档里尚未被别的 story 认领的那个。 */
  var railEl = null;
  if (opts.rail) railEl = typeof opts.rail === 'string' ? util.qs(opts.rail) : opts.rail;
  if (!railEl) {
    railEl = util.qs('[data-craft-rail]', root) ||
      util.qsa('[data-craft-rail]').filter(function (n) { return !n.__craftRailClaimed; })[0] ||
      null;
  }
  if (railEl) railEl.__craftRailClaimed = true;

  sections.forEach(function (s, i) {
    s.classList.add('craft-step');
    if (!s.id) s.id = 'craft-step-' + i;
    var h = s.querySelector('h1, h2, h3');
    if (h) { if (!h.id) h.id = s.id + '-title'; if (!h.hasAttribute('tabindex')) h.setAttribute('tabindex', '-1'); }
    s.setAttribute('aria-labelledby', h ? h.id : '');
  });

  function go(i, dir, scroll) {
    i = util.clamp(i, 0, sections.length - 1);
    if (i === current) return current;
    var prev = current;
    current = i;
    sections.forEach(function (s, j) {
      s.setAttribute('data-active', j === i ? 'true' : 'false');
      if (j === i) s.setAttribute('aria-current', 'step');
      else s.removeAttribute('aria-current');
    });
    if (railEl) {
      util.qsa('button', railEl).forEach(function (b, j) {
        if (j === i) b.setAttribute('aria-current', 'step');
        else b.removeAttribute('aria-current');
      });
    }
    if (scroll) scrollToStep(sections[i]);
    if (opts.onStep) opts.onStep(i, prev, sections[i]);
    try { history.replaceState(null, '', '#step=' + i); } catch (_) {}
    return current;
  }

  if (railEl) {
    railEl.classList.add('craft-rail');
    railEl.setAttribute('role', 'navigation');
    railEl.setAttribute('aria-label', opts.railLabel || '步骤导航');
    railEl.innerHTML = '';
    sections.forEach(function (s, i) {
      var title = s.getAttribute('data-craft-step-title') ||
        (s.querySelector('h1,h2,h3') ? s.querySelector('h1,h2,h3').textContent.trim() : '第 ' + (i + 1) + ' 步');
      var b = util.el('button', {
        type: 'button',
        'aria-label': '第 ' + (i + 1) + ' 步，共 ' + sections.length + ' 步：' + title,
        title: title
      });
      util.on(b, 'click', function () { go(i, 'rail', true); });
      railEl.appendChild(b);
    });
  }

  if (window.IntersectionObserver) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) go(+e.target.getAttribute('data-craft-step'), 'scroll', false);
      });
    }, { threshold: 0.55, rootMargin: '-12% 0px -12% 0px' });
    sections.forEach(function (s) { io.observe(s); });
  }

  function onKey(ev) {
    var keys = {
      ArrowDown: current + 1, PageDown: current + 1,
      ArrowUp: current - 1, PageUp: current - 1,
      Home: 0, End: sections.length - 1
    };
    var next = keys[ev.key];
    if (next === undefined) return;
    if (!root.contains(ev.target) && !(railEl && railEl.contains(ev.target))) return;
    ev.preventDefault();
    go(next, ev.key, true);
    var h = sections[current].querySelector('h1,h2,h3');
    if (h) h.focus({ preventScroll: true });
  }
  util.on(document, 'keydown', onKey);

  /* 深链：#step=3 */
  var m = /#step=(\d+)/.exec(location.hash || '');
  if (m) {
    var i0 = util.clamp(parseInt(m[1], 10), 0, sections.length - 1);
    go(i0, 'init', false);
    setTimeout(function () { scrollToStep(sections[i0]); }, 0);
  } else {
    go(0, 'init', false);
  }

  return {
    go: function (i) { return go(i, 'api', true); },
    next: function () { return go(current + 1, 'api', true); },
    prev: function () { return go(current - 1, 'api', true); },
    current: function () { return current; },
    count: sections.length,
    destroy: function () { if (io) io.disconnect(); }
  };
};

/* ── animate ──────────────────────────────────────────── */

function motionReduced() {
  var mode = (document.body && document.body.getAttribute('data-craft-reduced-motion')) || 'respect';
  if (mode === 'ignore') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

/* 无单位属性：数值不能追加 px，否则 setProperty 会被静默丢弃 */
var UNITLESS = {
  opacity: 1, 'fill-opacity': 1, 'stroke-opacity': 1, 'z-index': 1, zoom: 1,
  'flex-grow': 1, 'flex-shrink': 1, order: 1, 'line-height': 1, 'font-weight': 1
};

function applyProps(el, props, unit) {
  var isSvg = el.namespaceURI === SVG_NS;
  for (var k in props) {
    var v = props[k];
    if (isSvg) { el.setAttribute(k, v); continue; }
    var name = k.replace(/[A-Z]/g, function (c) { return '-' + c.toLowerCase(); });
    var value = typeof v !== 'number' ? v
      : UNITLESS[name] ? String(v)
      : v + (unit || 'px');
    el.style.setProperty(name, value);
  }
}

function readProp(el, prop) {
  var isSvg = el.namespaceURI === SVG_NS;
  if (isSvg) {
    var a = parseFloat(el.getAttribute(prop));
    if (isFinite(a)) return a;
  }
  var cs = getComputedStyle(el)[prop];
  var n = parseFloat(cs);

  reduced: motionReduced,
  duration: function (ms) { return motionReduced() ? 0 : ms; },
  /* 只支持数值属性：SVG 走 attribute，HTML 走 style（数值默认 px） */
  to: function (el, props, opts) {
    opts = opts || {};
    var dur = motionReduced() ? 0 : (opts.duration == null ? 240 : opts.duration);
    var ease = opts.easing || function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
    var from = {}, target = {};
    for (var k in props) { from[k] = readProp(el, k); target[k] = props[k]; }
    if (!dur) { applyProps(el, target, opts.unit); return Promise.resolve(); }
    return new Promise(function (resolve) {
      var t0 = performance.now();
      (function frame(now) {
        var t = Math.min(1, (now - t0) / dur);
        var e = ease(t), cur = {};
        for (var k in target) cur[k] = from[k] + (target[k] - from[k]) * e;
        applyProps(el, cur, opts.unit);
        if (t < 1) requestAnimationFrame(frame); else resolve();
      })(t0);
    });
  },
  tween: function (duration, cb) {
    var dur = motionReduced() ? 0 : duration;
    return new Promise(function (resolve) {
      if (!dur) { cb(1); resolve(); return; }
      var t0 = performance.now();
      (function frame(now) {
        var t = Math.min(1, (now - t0) / dur);
        cb(t);
        if (t < 1) requestAnimationFrame(frame); else resolve();
      })(t0);
    });
  }
};

var liveRegion = null;

var a11y = Craft.a11y = {
  announce: function (msg) {
    if (!liveRegion) {
      liveRegion = util.el('div', {
        'class': 'craft-sr-only', role: 'status',
        'aria-live': 'polite', 'aria-atomic': 'true'
      });
      document.body.appendChild(liveRegion);
    }
    liveRegion.textContent = '';
    setTimeout(function () { liveRegion.textContent = msg; }, 30);
  },
  describe: function (svg, text) {
    if (!svg) return;
    if (!svg.hasAttribute('role')) svg.setAttribute('role', 'img');
    if (!svg.hasAttribute('aria-label')) svg.setAttribute('aria-label', text);
  },
  /* 容器内元素按方向键轮转焦点 */
  roving: function (root, selector) {
    var items = util.qsa(selector, root);
    items.forEach(function (n) {
      if (!n.hasAttribute('tabindex')) n.setAttribute('tabindex', '-1');
    });
    if (items[0]) items[0].setAttribute('tabindex', '0');
    util.on(root, 'keydown', function (ev) {
      var i = items.indexOf(document.activeElement);
      if (i < 0) return;
      var next = ev.key === 'ArrowRight' || ev.key === 'ArrowDown' ? i + 1
        : ev.key === 'ArrowLeft' || ev.key === 'ArrowUp' ? i - 1
        : ev.key === 'Home' ? 0 : ev.key === 'End' ? items.length - 1 : -1;
      if (next < 0) return;
      ev.preventDefault();
      items.forEach(function (n) { n.setAttribute('tabindex', '-1'); });
      var t = items[util.clamp(next, 0, items.length - 1)];
      t.setAttribute('tabindex', '0');
      t.focus();
    });
    return items;
  }
};

/* ── zoom（刻意做薄：仅 x 轴滚轮缩放 + 拖拽平移） ──────── */

var zoom = Craft.zoom = {
  attach: function (chartInstance, opts) {
    opts = opts || {};
    var svg = chartInstance.svg;
    if (!svg || !chartInstance.x || !chartInstance.x.invert) return null;
    var full = chartInstance.x.domain().slice();
    var minSpan = (opts.minSpanRatio || 0.05) * (full[1] - full[0]);
    var isBand = !!chartInstance.x.bandwidth;

    function apply(lo, hi) {
      var span = util.clamp(hi - lo, minSpan, full[1] - full[0]);
      lo = util.clamp(lo, full[0], full[1] - span);
      chartInstance.xDomainOverride = [lo, lo + span];
      chartInstance.redraw();
      util.emit(svg, 'craft:zoom', { domain: chartInstance.xDomainOverride });
    }

    util.on(svg, 'wheel', function (ev) {
      if (isBand) return;
      ev.preventDefault();
      var rect = svg.getBoundingClientRect();
      var px = (ev.clientX - rect.left) / rect.width;
      var dom = chartInstance.x.domain();
      var span = dom[1] - dom[0];
      var k = ev.deltaY > 0 ? 1.15 : 1 / 1.15;
      var anchor = dom[0] + span * px;
      apply(anchor - (anchor - dom[0]) * k, anchor + (dom[1] - anchor) * k);
    }, { passive: false });

    var dragging = null;
    util.on(svg, 'pointerdown', function (ev) {
      if (isBand) return;
      dragging = { x: ev.clientX, dom: chartInstance.x.domain().slice() };
      svg.setPointerCapture && svg.setPointerCapture(ev.pointerId);
      svg.style.cursor = 'grabbing';
    });
    util.on(svg, 'pointermove', function (ev) {
      if (!dragging) return;
      var rect = svg.getBoundingClientRect();
      var dom = dragging.dom;
      var shift = (ev.clientX - dragging.x) / rect.width * (dom[1] - dom[0]);
      apply(dom[0] - shift, dom[1] - shift);
    });
    function endDrag() { dragging = null; svg.style.cursor = ''; }
    util.on(svg, 'pointerup', endDrag);
    util.on(svg, 'pointercancel', endDrag);
    util.on(svg, 'dblclick', function () {
      chartInstance.xDomainOverride = null;
      chartInstance.redraw();
    });

    return {
      reset: function () { chartInstance.xDomainOverride = null; chartInstance.redraw(); },
      destroy: function () { chartInstance.xDomainOverride = null; }
    };
  }
};

/* ── sim（参数驱动沙盘） ──────────────────────────────── */

var simDefs = {};
var sims = [];

var sim = Craft.sim = {
  /* 声明式注册：boot() 会自动挂载所有匹配的 [data-craft-sim] */
  define: function (id, def) { simDefs[id] = def; return sim; },
  mount: function (el) {
    var id = el.getAttribute('data-craft-sim');
    var def = simDefs[id];
    if (!def) { console.warn('[craft] 未注册的模拟 "' + id + '"：先调用 Craft.sim.define'); return null; }

    var initial = Object.assign({}, def.state || {});
    var state = Object.assign({}, initial);
    var frames = 0;
    var running = false;
    var rafId = null;
    var continuous = (el.getAttribute('data-craft-frame') || def.frame || 'manual') === 'raf';
    var speedKey = el.getAttribute('data-craft-speed');

    var inst = { id: id, el: el, def: def, state: state, frames: frames };

    function ctx() {
      return {
        state: state,
        initial: initial,
        frame: frames,
        el: el,
        sim: inst,
        set: binder.set,
        fmt: fmt,
        Craft: Craft
      };
    }

    function draw() {
      inst.state = state;
      inst.frames = frames;
      if (def.draw) def.draw(ctx());
    }

    var binder = Craft.bind(el, {
      state: initial,
      onChange: function (s) {
        state = s;
        inst.state = s;
        if (def.reset) def.reset(ctx());
        draw();
      }
    });

    function tick() {
      if (!running) return;
      frames++;
      if (def.step) def.step(ctx());
      draw();
      if (continuous) rafId = requestAnimationFrame(tick);
      else running = false;
    }

    inst.start = function () {
      if (running) return inst;
      running = true;
      if (!continuous) { tick(); }
      else rafId = requestAnimationFrame(tick);
      return inst;
    };
    inst.stop = function () {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      return inst;
    };
    inst.stepOnce = function () { running = true; tick(); return inst; };
    inst.reset = function () {
      inst.stop();
      frames = 0;
      state = Object.assign({}, initial);
      inst.state = state;
      binder.reset();
      if (def.reset) def.reset(ctx());
      draw();
      return inst;
    };
    inst.destroy = function () { inst.stop(); binder.destroy(); };
    inst.draw = draw;

    /* 声明式按钮：data-craft-sim-start / -stop / -step / -reset */
    util.qsa('[data-craft-sim-start]', el).forEach(function (b) {
      util.on(b, 'click', function () { inst.start(); });
    });
    util.qsa('[data-craft-sim-stop]', el).forEach(function (b) {
      util.on(b, 'click', function () { inst.stop(); });
    });
    util.qsa('[data-craft-sim-step]', el).forEach(function (b) {
      util.on(b, 'click', function () { inst.stepOnce(); });
    });
    util.qsa('[data-craft-sim-reset]', el).forEach(function (b) {
      util.on(b, 'click', function () { inst.reset(); });
    });

    sims.push(inst);
    /* 先 reset 再画首帧。reset 的语义是「建立初始状态」，而以前这里直接 draw() ——
       于是 ctx.sim 上那些在 reset 里初始化的字段（历史数组、计数器）在首帧还是 undefined：
       图表会以空数据挂载，而空图表返回的是 no-op 实例，之后再也更新不了，
       界面看上去就是「模拟跑了但图一直是空的」。 */
    if (def.reset) def.reset(ctx());
    if (def.autostart) inst.start(); else draw();
    return inst;
  },
  all: function () { return sims.slice(); }
};

/* ── panzoom ──────────────────────────────────────────── */

/* SVG 相机：滚轮对准光标缩放、拖拽平移、缩放到指定包围盒。
   改的是 viewBox，不动 DOM 结构 —— 所以主题重绘不会打乱相机。 */

Craft.panzoom = {
  attach: function (svg, opts) {
    opts = opts || {};
    /* 基准 viewBox 由调用方显式给出 —— 挂在 DOM 上的那个可能还没设好，
       读它会把基准记成默认的 800×600，「复位」就回不到真实尺寸。 */
    var base = (opts.base || (svg.getAttribute('viewBox') || '0 0 800 600').split(/\s+/)).map(Number);
    var baseW = base[2], baseH = base[3];
    var minScale = opts.minScale || 0.4;
    var maxScale = opts.maxScale || 4;
    var state = { x: base[0], y: base[1], w: baseW, h: baseH };
    var subs = [];

    function apply() {
      svg.setAttribute('viewBox', [r1(state.x), r1(state.y), r1(state.w), r1(state.h)].join(' '));
      var scale = baseW / state.w;
      var level = scale >= 1.7 ? 'full' : scale >= 1.0 ? 'read' : 'map';
      var host = svg.closest('[data-craft-diagram]') || svg.parentNode;
      if (host && host.setAttribute) {
        host.setAttribute('data-craft-detail', level);
        host.setAttribute('data-craft-zoom', String(Math.round(scale * 100)));
      }
      subs.forEach(function (fn) { try { fn(state, scale); } catch (e) { console.error(e); } });
    }

    function clampView() {
      var minW = baseW / maxScale, maxW = baseW / minScale;
      state.w = Math.max(minW, Math.min(maxW, state.w));
      state.h = state.w * baseH / baseW;
      /* 不让内容完全跑出视野 */
      var slackX = state.w * 0.5, slackY = state.h * 0.5;
      state.x = Math.max(base[0] - slackX, Math.min(base[0] + baseW - state.w + slackX, state.x));
      state.y = Math.max(base[1] - slackY, Math.min(base[1] + baseH - state.h + slackY, state.y));
    }

    function zoomAt(px, py, factor) {
      var wx = state.x + px * state.w, wy = state.y + py * state.h;
      var nw = state.w * factor;
      state.x = wx - px * nw;
      state.y = wy - py * (nw * baseH / baseW);
      state.w = nw;
      state.h = nw * baseH / baseW;
      clampView();
      apply();
    }

    var dragging = null;
    util.on(svg, 'wheel', function (ev) {
      ev.preventDefault();
      var rect = svg.getBoundingClientRect();
      if (!rect.width) return;
      zoomAt((ev.clientX - rect.left) / rect.width,
             (ev.clientY - rect.top) / rect.height,
             ev.deltaY > 0 ? 1.15 : 1 / 1.15);
    }, { passive: false });

    util.on(svg, 'pointerdown', function (ev) {
      if (ev.button !== 0) return;
      dragging = { x: ev.clientX, y: ev.clientY, vx: state.x, vy: state.y };
      if (svg.setPointerCapture) svg.setPointerCapture(ev.pointerId);
      svg.style.cursor = 'grabbing';
    });
    util.on(svg, 'pointermove', function (ev) {
      if (!dragging) return;
      var rect = svg.getBoundingClientRect();
      if (!rect.width) return;
      state.x = dragging.vx - (ev.clientX - dragging.x) / rect.width * state.w;
      state.y = dragging.vy - (ev.clientY - dragging.y) / rect.height * state.h;
      clampView();
      apply();
    });
    function endDrag() { dragging = null; svg.style.cursor = ''; }
    util.on(svg, 'pointerup', endDrag);
    util.on(svg, 'pointercancel', endDrag);

    var api = {
      state: state,
      onChange: function (fn) { subs.push(fn); return function () { var i = subs.indexOf(fn); if (i >= 0) subs.splice(i, 1); }; },
      reset: function () { state.x = base[0]; state.y = base[1]; state.w = baseW; state.h = baseH; apply(); },
      zoomBy: function (f) { zoomAt(0.5, 0.5, f); },
      /** 缩放到某个世界坐标包围盒，留出 padding */
      zoomTo: function (box, pad) {
        pad = pad == null ? 48 : pad;
        var w = Math.max(box.w + pad * 2, baseW / maxScale);
        state.w = w;
        state.h = w * baseH / baseW;
        state.x = box.x + box.w / 2 - state.w / 2;
        state.y = box.y + box.h / 2 - state.h / 2;
        clampView();
        apply();
      },
      /** 只适配一个轴上的范围（导览故事用） */
      focusNodes: function (ids) {
        var box = null;
        ids.forEach(function (id) {
          var n = svg.querySelector('[data-craft-node="' + cssEscape(id) + '"]');
          if (!n) return;
          var b = nodeBoxOf(n);
          if (!b) return;
          box = box ? {
            x: Math.min(box.x, b.x), y: Math.min(box.y, b.y),
            w: Math.max(box.x + box.w, b.x + b.w) - Math.min(box.x, b.x),
            h: Math.max(box.y + box.h, b.y + b.h) - Math.min(box.y, b.y)
          } : b;
        });
        if (box) api.zoomTo(box, 64);
      },
      destroy: function () { subs.length = 0; }
    };

    apply();
    return api;
  }
};

/** 从 data-* 读节点的世界坐标包围盒（渲染时写进去的） */
function nodeBoxOf(el) {
  var g = el.getAttribute('data-craft-node') ? el : el.closest('[data-craft-node]');
  if (!g) return null;
  var x = parseFloat(g.getAttribute('data-x')), y = parseFloat(g.getAttribute('data-y'));
  var w = parseFloat(g.getAttribute('data-w')), h = parseFloat(g.getAttribute('data-h'));
  return [x, y, w, h].every(isFinite) ? { x: x, y: y, w: w, h: h } : null;
}

    /* ── 面板内容 ── */

    function renderPanel() {

    /* ── 实例 API ── */

    inst.reach = function (id, dir) {
      var r = Craft.trace.reach(scene, id, dir);
      inst.selected = id;
      Craft.trace.apply(inst, [id].concat(r.ids), dir === 'up' ? 'up' : 'down', r.depth);
      inst.panzoom.focusNodes([id].concat(r.ids));
      renderPanel();
      inst.writeHash && inst.writeHash({ focus: id, reach: dir });
      a11y.announce((dir === 'up' ? '上游 ' : '下游 ') + r.ids.length + ' 个组件');
      return r;
    };

    inst.showPath = function (a, b) {
      var p = Craft.trace.path(scene, a, b);
      if (!p) {
        a11y.announce('从 ' + a + ' 到 ' + b + ' 没有有向路径');
        return null;
      }
      inst.selected = a;
      Craft.trace.apply(inst, p, 'path');
      inst.panzoom.focusNodes(p);
      renderPanel();
      inst.writeHash && inst.writeHash({ route: a + '~' + b });
      a11y.announce('路径共 ' + p.length + ' 跳：' + p.join(' → '));
      return p;
    };

    inst.reset = function () {
      inst.selected = null;
      Craft.trace.clear(inst);
      inst.panzoom.reset();

      inst.writeHash && inst.writeHash({});
      return inst;
    };

    inst.caption = function (view) {
      if (!view) { captionBox.hidden = true; return; }
      captionBox.hidden = false;
      captionBox.innerHTML = '';
      captionBox.appendChild(util.el('strong', { text: view.label }));
      if (view.note) captionBox.appendChild(util.el('span', { text: ' — ' + view.note }));
    };

    inst.openSearch = function () {
      searchBox.hidden = false;
      searchInput.value = '';
      searchList.innerHTML = '';
      searchInput.focus();
    };
    inst.closeSearch = function () {
      if (searchBox.hidden) return false;
      searchBox.hidden = true;
      return true;
    };
    inst.toggleHelp = function () { helpBox.hidden = !helpBox.hidden; };
    inst.closeOverlays = function () {
      if (inst.closeSearch()) return true;
      if (!helpBox.hidden) { helpBox.hidden = true; return true; }
      if (inst.selected) { inst.reset(); return true; }
      if (Craft.present.active()) { Craft.present.toggle(false); return true; }
      return false;
    };

    function runSearch() {
      var hits = Craft.find.query(index, searchInput.value);
      searchList.innerHTML = '';
      if (!hits.length) {
        searchList.appendChild(util.el('div', { 'class': 'craft-search-empty', text: '没有匹配的组件' }));
        return;
      }
      hits.forEach(function (h) {
        var b = util.el('button', { type: 'button', role: 'option', text: h.label });
        util.on(b, 'click', function () {
          inst.closeSearch();
          inst.focus(h.id);
        });
        searchList.appendChild(b);
      });
    }
    var index = Craft.find.index(scene);
    util.on(searchInput, 'input', runSearch);
    util.on(searchInput, 'keydown', function (ev) {
      if (ev.key === 'Escape') { inst.closeSearch(); return; }
      if (ev.key === 'Enter') {
        var first = searchList.querySelector('button');
        if (first) first.click();
      }
    });

    /* 信息面板挂在工具栏旁边；缩略图挂在右下 */
    Craft.minimap.attach(inst, chrome);
    Craft.deck.bind(inst);

    /* focus 时同步面板 */
    var baseFocus = inst.focus;
    inst.focus = function (id) {
      var n = baseFocus(id);
      if (n) {
        inst.writeHash && inst.writeHash({ focus: id });
        renderPanel();
      }
      return n;
    };

    inst.destroy = function () {
      inst.destroyed = true;
      surface.destroy();
      var i = diagrams.indexOf(inst);
      if (i >= 0) diagrams.splice(i, 1);
    };

    diagrams.push(inst);
    surface.redraw();
    return inst;
  },
  all: function () { return diagrams.slice(); }
};

/* ── trace ────────────────────────────────────────────── */

/* 上下游可达、最短有向路径、关系钉住。 */

Craft.trace = {
  /** dir: 'up' | 'down'，沿有向边 BFS，返回 {ids, depth} */
  reach: function (scene, id, dir) {
    var adj = {};
    scene.edges.forEach(function (e) {
      var a = dir === 'down' ? e.from : e.to;
      var b = dir === 'down' ? e.to : e.from;
      (adj[a] = adj[a] || []).push(b);
    });
    var seen = {}, depth = {}, queue = [[id, 0]];
    seen[id] = true;
    while (queue.length) {
      var pair = queue.shift();
      var cur = pair[0], d = pair[1];
      (adj[cur] || []).forEach(function (next) {
        if (seen[next]) return;
        seen[next] = true;
        depth[next] = d + 1;
        queue.push([next, d + 1]);
      });
    }
    delete seen[id];
    delete depth[id];
    return { ids: Object.keys(seen), depth: depth };
  },

  /** 最短有向路径（BFS），返回节点 id 数组或 null */
  path: function (scene, from, to) {
    if (from === to) return [from];
    var adj = {};
    scene.edges.forEach(function (e) { (adj[e.from] = adj[e.from] || []).push(e.to); });
    var prev = {}, seen = {}, queue = [from];
    seen[from] = true;
    while (queue.length) {
      var cur = queue.shift();
      if (cur === to) break;
      (adj[cur] || []).forEach(function (next) {
        if (seen[next]) return;
        seen[next] = true;
        prev[next] = cur;
        queue.push(next);
      });
    }
    if (!seen[to]) return null;
    var out = [to];
    while (out[0] !== from) out.unshift(prev[out[0]]);
    return out;
  },

  /** 给场景里的元素打标记；kind 决定视觉 */
  apply: function (inst, ids, kind, depth) {
    var set = {};
    (ids || []).forEach(function (id) { set[id] = true; });
    var on = ids && ids.length > 0;
    util.qsa('[data-craft-node]', inst.svg).forEach(function (g) {
      var id = g.getAttribute('data-craft-node');
      g.setAttribute('data-trace', on ? (set[id] ? kind : 'dim') : '');
      if (depth && depth[id] != null) g.setAttribute('data-trace-depth', String(depth[id]));
      else g.removeAttribute('data-trace-depth');
    });
    util.qsa('[data-craft-edge-group]', inst.svg).forEach(function (g) {
      var a = g.getAttribute('data-craft-edge-from'), b = g.getAttribute('data-craft-edge-to');
      g.setAttribute('data-trace', on ? (set[a] && set[b] ? kind : 'dim') : '');
    });
  },

  clear: function (inst) {
    util.qsa('[data-craft-node], [data-craft-edge-group]', inst.svg).forEach(function (g) {
      g.setAttribute('data-trace', '');
    });
  }
};

/* ── find ─────────────────────────────────────────────── */

Craft.find = {
  index: function (scene) {
    return scene.nodes.map(function (n) {
      return {
        id: n.id, label: n.label, sublabel: n.sublabel || '', kind: n.kind,
        text: [n.label, n.sublabel, n.kind, n.id].filter(Boolean).join(' ').toLowerCase()
      };
    });
  },
  query: function (index, q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return [];
    var hits = index.filter(function (r) { return r.text.indexOf(q) >= 0; });
    /* 前缀命中的排前面 */
    hits.sort(function (a, b) {
      var ap = a.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
      var bp = b.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
      return (ap - bp) || (a.label.length - b.label.length);
    });
    return hits.slice(0, 8);
  }
};

/* ── export ───────────────────────────────────────────── */

/* 导出前先把运行时状态剥掉，否则截出来的图带着高亮和选中态。 */

var EXPORT_STRIP = ['data-hover', 'data-focus', 'data-trace', 'data-trace-depth', 'data-active'];

function serializeCleanSvg(svg) {
  var clone = svg.cloneNode(true);
  EXPORT_STRIP.forEach(function (attr) {
    util.qsa('[' + attr + ']', clone).forEach(function (n) { n.removeAttribute(attr); });
  });
  clone.removeAttribute('tabindex');
  var vb = (svg.getAttribute('viewBox') || '0 0 800 600').split(/\s+/).map(Number);
  var w = vb[2], h = vb[3];
  clone.setAttribute('width', w);
  clone.setAttribute('height', h);

  /* 把令牌算成实际颜色 —— 否则导出的 SVG 在别处没有变量可用 */
  var tokens = theme.tokens();
  var vars = Object.keys(tokens).map(function (k) { return k + ':' + tokens[k] + ';'; }).join('');
  var style = util.svgEl('style', {});
  style.textContent =
    ':root{' + vars + '}' +
    '.craft-node-body{stroke:none}' +
    '.craft-edge{fill:none;stroke:var(--craft-axis);stroke-width:1.5}' +
    '.craft-arrow{fill:var(--craft-axis)}' +
    '.craft-node-label{fill:var(--craft-text);font:13px ' + (tokens['--craft-font-sans'] || 'sans-serif') + '}' +
    '.craft-node-sublabel,.craft-edge-label,.craft-band-label,.craft-group-label{fill:var(--craft-muted)}' +
    '.craft-node-sublabel,.craft-edge-label{font-size:11px}' +
    '.craft-group-rect{fill:none;stroke:var(--craft-border);stroke-dasharray:7 5}' +
    '.craft-band-rect{fill:var(--craft-surface);stroke:var(--craft-border)}' +
    '.craft-lifeline{stroke:var(--craft-axis);stroke-dasharray:4 4}' +
    '.craft-activation{fill:var(--craft-surface-2);stroke:var(--craft-border)}';
  clone.insertBefore(style, clone.firstChild);
  return new XMLSerializer().serializeToString(clone);
}

Craft.export = {
  svg: function (inst) {
    var s = serializeCleanSvg(inst.svg);
    download(new Blob([s], { type: 'image/svg+xml' }), inst.name + '.svg');
    return s.length;
  },
  png: function (inst, scale) {
    scale = scale || 2;
    var vb = (inst.svg.getAttribute('viewBox') || '0 0 800 600').split(/\s+/).map(Number);
    /* 16MiB 画布上限：超了就自动降倍率 */
    var maxPixels = 16 * 1024 * 1024;
    while (scale > 1 && vb[2] * scale * vb[3] * scale > maxPixels) scale -= 0.5;
    var src = serializeCleanSvg(inst.svg);
    var img = new Image();
    var url = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' }));
    return new Promise(function (resolve, reject) {
      img.onload = function () {
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(vb[2] * scale);
        canvas.height = Math.round(vb[3] * scale);
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = theme.token('--craft-bg', '#fff');
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          if (!blob) { reject(new Error('canvas.toBlob 失败')); return; }
          download(blob, inst.name + '.png');
          resolve(blob.size);
        }, 'image/png');
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('SVG 载入失败')); };
      img.src = url;
    });
  }
};

function download(blob, filename) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    URL.revokeObjectURL(a.href);
    if (a.parentNode) a.parentNode.removeChild(a);
  }, 0);
}

/* ── minimap ──────────────────────────────────────────── */

Craft.minimap = {
  attach: function (inst, host) {
    var W = 168, H = 112, pad = 6;
    var s = inst.scene;
    var k = Math.min((W - pad * 2) / s.width, (H - pad * 2) / s.height);
    var box = util.el('div', { 'class': 'craft-minimap', role: 'img',
      'aria-label': '缩略图，共 ' + s.nodes.length + ' 个节点' });
    var svg = util.svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H });
    svg.appendChild(util.svgEl('rect', { x: 0, y: 0, width: W, height: H, rx: 8, 'class': 'craft-minimap-bg' }));
    var g = util.svgEl('g', { transform: 'translate(' + pad + ',' + pad + ') scale(' + k + ')' });
    s.nodes.forEach(function (n) {
      g.appendChild(util.svgEl('rect', {
        x: n.x, y: n.y, width: n.w, height: n.h, rx: 6 / k,
        'class': 'craft-minimap-node', 'data-minimap-node': n.id, fill: kindColor(n.kind)
      }));
    });
    svg.appendChild(g);
    var view = util.svgEl('rect', { 'class': 'craft-minimap-view', rx: 4 });
    svg.appendChild(view);
    box.appendChild(svg);
    host.appendChild(box);

    function sync(state) {
      var bx = (state.x / s.width) * (W - pad * 2) + pad;
      var by = (state.y / s.height) * (H - pad * 2) + pad;
      var bw = (state.w / s.width) * (W - pad * 2);
      var bh = (state.h / s.height) * (H - pad * 2);
      view.setAttribute('x', r1(Math.max(pad, Math.min(W - pad, bx))));
      view.setAttribute('y', r1(Math.max(pad, Math.min(H - pad, by))));
      view.setAttribute('width', r1(Math.max(6, Math.min(W - pad * 2, bw))));
      view.setAttribute('height', r1(Math.max(6, Math.min(H - pad * 2, bh))));
      /* 可见比例：能看全整张图时缩略图没有信息量，只有遮挡 —— 隐藏它。
         缩放或平移之后才显出来。 */
      var frac = Math.min(1, s.width / state.w) * Math.min(1, s.height / state.h);
      box.setAttribute('data-active', frac < 0.9 ? '1' : '0');
    }
    inst.panzoom.onChange(sync);
    sync(inst.panzoom.state);

    util.on(svg, 'click', function (ev) {
      var r = svg.getBoundingClientRect();
      var wx = ((ev.clientX - r.left) / r.width * W - pad) / k;
      var wy = ((ev.clientY - r.top) / r.height * H - pad) / k;
      inst.panzoom.zoomTo({ x: wx - 80, y: wy - 60, w: 160, h: 120 }, 0);
    });
    return box;
  }
};

/* ── story ────────────────────────────────────────────── */

Craft.story = {
  run: function (inst, views) {
    views = views || [];
    if (!views.length) return null;
    var i = -1;
    function show(k) {
      if (k < 0 || k >= views.length) return i;
      i = k;
      var v = views[k];
      var ids = (v.focus || []).filter(function (id) { return inst.scene.byId[id]; });
      Craft.trace.apply(inst, ids.length ? ids : null, 'focus');
      if (ids.length) inst.panzoom.focusNodes(ids);
      else inst.panzoom.reset();
      util.qsa('[data-craft-view]', inst.root).forEach(function (b) {
        b.setAttribute('aria-current', String(+b.getAttribute('data-craft-view') === k));
      });
      inst.caption(v);
      util.emit(inst.root, 'craft:view', { index: k, view: v });
      return i;
    }
    return {
      show: show,
      next: function () { return show(Math.min(views.length - 1, i + 1)); },
      prev: function () { return show(Math.max(0, i - 1)); },
      clear: function () { i = -1; Craft.trace.clear(inst); inst.panzoom.reset(); inst.caption(null); return i; },
      count: views.length,
      current: function () { return i; }
    };
  }
};

/* ── present ──────────────────────────────────────────── */

Craft.present = {
  toggle: function (on) {
    var next = on == null ? !document.documentElement.hasAttribute('data-craft-present')
                          : !!on;
    if (next) document.documentElement.setAttribute('data-craft-present', '');
    else document.documentElement.removeAttribute('data-craft-present');
    try {
      var url = new URL(location.href);
      if (next) url.searchParams.set('present', '1'); else url.searchParams.delete('present');
      history.replaceState(null, '', url.toString());
    } catch (_) {}
    return next;
  },
  active: function () { return document.documentElement.hasAttribute('data-craft-present'); }
};

/* ── deck ─────────────────────────────────────────────── */

/* 命令台 + 键位 + 深链。深链用 hash，写回走 replaceState 不污染历史。 */

Craft.deck = {
  bind: function (inst) {
    var scene = inst.scene;
    var index = Craft.find.index(scene);
    var story = Craft.story.run(inst, inst.model.views);
    inst.story = story;

    /* 深链：#focus=api&reach=down / #view=entry / #route=a~b */
    function fromHash() {
      var raw = String(location.hash || '').replace(/^#/, '');
      if (!raw) return;
      var p = new URLSearchParams(raw);
      var focus = p.get('focus'), view = p.get('view'), route = p.get('route');
      if (view && story) story.show(storyIndex(view));
      if (focus && scene.byId[focus]) {
        inst.focus(focus);
        var reach = p.get('reach');
        if (reach === 'up' || reach === 'down') inst.reach(focus, reach);
      }
      if (route) {
        var ends = route.split('~');
        if (ends.length === 2) inst.showPath(ends[0], ends[1]);
      }
    }
    function storyIndex(id) {
      for (var i = 0; i < inst.model.views.length; i++) {
        if (inst.model.views[i].id === id) return i;
      }
      return 0;
    }
    function writeHash(params) {
      var s = Object.keys(params).filter(function (k) { return params[k]; })
        .map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
      try { history.replaceState(null, '', s ? '#' + s : location.pathname + location.search); } catch (_) {}
    }
    inst.writeHash = writeHash;

    util.on(window, 'hashchange', fromHash);

    /* 键位。输入框里不劫持。 */
    util.on(document, 'keydown', function (ev) {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      var t = ev.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) {
        if (ev.key !== 'Escape') return;
      }
      switch (ev.key) {
        case '/': ev.preventDefault(); inst.openSearch(); break;
        case '+': case '=': ev.preventDefault(); inst.panzoom.zoomBy(1 / 1.25); break;
        case '-': ev.preventDefault(); inst.panzoom.zoomBy(1.25); break;
        case '0': ev.preventDefault(); inst.reset(); break;
        case 'f': case 'F': ev.preventDefault(); Craft.present.toggle(); break;
        case 't': case 'T': ev.preventDefault(); theme.toggle(); break;
        case 'Escape':
          if (inst.closeOverlays()) ev.preventDefault();
          break;
        case '?': ev.preventDefault(); inst.toggleHelp(); break;
        default:
          if (story && (ev.key === ']' || ev.key === '[')) {
            ev.preventDefault();
            if (ev.key === ']') story.next(); else story.prev();
          }
      }
    });

    if (location.hash) fromHash();
    return inst;
  }
};

/* ── boot ─────────────────────────────────────────────── */

function chartConfigFromAttrs(el) {
  function a(n, d) {
    var v = el.getAttribute('data-craft-' + n);
    return v == null ? d : v;
  }
  function n(nm, d) {
    var v = el.getAttribute('data-craft-' + nm);
    return v == null ? d : parseFloat(v);
  }
  var cfg = {
    id: el.getAttribute('data-craft-chart'),
    type: a('chart-type', 'line'),
    dataKey: a('data', 'main'),
    height: n('height', 360),
    legend: a('legend', 'auto'),
    table: a('table', 'auto'),
    zoom: a('zoom', 'none'),
    title: a('title', null),
    caption: a('caption', null),
    ariaLabel: a('aria-label', null)
  };
  var xf = a('x', null), yf = a('y', null);
  if (xf) cfg.x = { field: xf, type: a('x-type', null), label: a('x-label', null), format: a('x-format', null) };
  if (yf) cfg.y = { field: yf, type: a('y-type', null), label: a('y-label', null), format: a('y-format', null) };
  var sf = a('series', null);
  if (sf) cfg.series = { field: sf, color: a('color', 'categorical') };

  /* 自定义图表：按名字取作者在解析期注册的 render 与 data */
  var renderName = a('chart-render', null);
  if (renderName) {
    var def = chartRenderers[renderName];
    if (!def) {
      console.warn('[craft] 图表 "' + cfg.id + '" 引用了未注册的 renderer "' + renderName +
                   '"：先调用 Craft.chart.define');
    } else {
      if (def.render && !cfg.render) cfg.render = def.render;
      if (def.data !== undefined && cfg.data == null) cfg.data = def.data;
      /* 自定义图表自己知道该用哪些字段、什么边距 —— 作为默认值并入，
         属性上显式写的仍然优先。缺了字段映射会让坐标域退回 [0,1]，曲线画到天外去。 */
      ['x', 'y', 'margin', 'height', 'legend', 'table', 'color'].forEach(function (k) {
        if (def[k] !== undefined && cfg[k] == null) cfg[k] = def[k];
      });
    }
  }
  return cfg;
}

function updateThemeToggle() {
  var next = theme.current() === 'light' ? '深色' : '浅色';
  util.qsa('[data-craft-theme-toggle]').forEach(function (b) {
    b.setAttribute('aria-label', '切换到' + next + '主题');
    var label = b.querySelector('[data-craft-theme-label]');
    if (label) label.textContent = next;
  });
}

Craft.boot = function () {
  util.qsa('[data-craft-theme-toggle]').forEach(function (btn) {
    if (btn.__craftWired) return;
    btn.__craftWired = true;
    util.on(btn, 'click', function () { theme.toggle(); });
  });
  theme.onChange(updateThemeToggle);
  updateThemeToggle();

  /* chart：零 JS 声明式挂载 */
  util.qsa('[data-craft-chart]').forEach(function (el) {
    if (el.__craftMounted) return;
    el.__craftMounted = true;
    var inst = chart.mount(el, chartConfigFromAttrs(el));
    if (el.getAttribute('data-craft-zoom') === 'x') zoom.attach(inst, {});
  });

  /* diagram：零 JS 声明式挂载（模型内联在 data-craft-model 块里） */
  util.qsa('[data-craft-diagram]').forEach(function (el) {
    if (el.__craftMounted) return;
    el.__craftMounted = true;
    diagram.mount(el, {});
  });

  /* simulation：用已注册的 def 自动挂载 */
  util.qsa('[data-craft-sim]').forEach(function (el) {
    if (el.__craftMounted) return;
    el.__craftMounted = true;
    sim.mount(el);
  });

  /* explainer：有 data-craft-step 就自动接管，除非作者已手动初始化 */
  var seenHosts = [];
  util.qsa('[data-craft-step]').forEach(function (el) {
    var top = el.closest('[data-craft-story]') || el.parentElement;
    if (!top || seenHosts.indexOf(top) >= 0) return;
    seenHosts.push(top);
    if (!top.__craftStepped) Craft.step(top, {});
  });

  document.documentElement.setAttribute('data-craft-ready', '');
  booted = true;
  /* 延后一帧再广播：作者脚本通常也在 DOMContentLoaded 里注册监听，
     而它注册得比 boot 晚 —— 同步发事件会被整个错过。 */
  var payload = { charts: charts.length, sims: sims.length };
  requestAnimationFrame(function () { util.emit(document, 'craft:ready', payload); });
  setTimeout(function () { util.emit(document, 'craft:ready', payload); }, 0);
};

var booted = false;

/** 已启动就立刻回调，否则等 craft:ready —— 避免时序竞态 */
Craft.ready = function (fn) {
  if (booted) { fn(); return; }
  var once = function () { document.removeEventListener('craft:ready', once); fn(); };
  document.addEventListener('craft:ready', once);
};

Craft.version = '1.0.0';

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { Craft.boot(); });
} else {
  Craft.boot();
}

})();
</script>



</body>
</html>
